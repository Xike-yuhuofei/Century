/* V1.1: 全站水晶均按实际颗数绘制，而非「单颗 × 数量」。 */
.stone-group { display:inline-flex; align-items:center; vertical-align:middle; white-space:normal; flex-shrink:0; }
.stone-gems { display:inline-flex; flex-wrap:wrap; align-items:center; gap:6px; max-width:100%; }
.stone-line { justify-content:center; }
.merchant-card .stone-line { gap:7px; }
.merchant-card .stone-gems { gap:5px; }
.merchant-card .gem { width:16px; height:16px; margin:2px; }
.golem-card .stone-gems { gap:5px; justify-content:center; }
.golem-card .gem { width:16px; height:16px; margin:2px; }
.merchant-card .market-bonus .gem { width:13px; height:13px; margin:1px; }
.merchant-card.played-face { cursor:default; filter:saturate(.85); }
.merchant-card.played-face:hover,.merchant-card.inactive-face:hover { transform:none; border-color:#647379; }
.merchant-card.inactive-face { cursor:default; }

/* 双人桌布：左右各自独立的卡牌区，中间共享两个市场。 */
.layout.duel-layout { width:100%; max-width:none; margin:0 auto; padding:10px clamp(18px,1.05vw,42px) 16px; }
.duel-layout .topbar { height:64px; margin-bottom:11px; }
.duel-layout .brand-text strong { font-size:21px; }
.duel-now { margin-left:auto; border:1px solid #73654e; border-radius:8px; background:#332f2a; color:#f1d2a0; padding:9px 16px; font-size:15px; font-weight:750; }
.duel-layout .top-actions { margin-left:12px; }
.duel-table { display:grid; grid-template-columns:minmax(440px,1fr) minmax(790px,1.56fr) minmax(440px,1fr); align-items:stretch; gap:clamp(12px,.85vw,27px); height:calc(100dvh - 105px); min-height:800px; }
.duel-player,.duel-center { min-width:0; border:1px solid #2c5057; border-radius:17px; background:linear-gradient(145deg,#172e3c,#0f2330 85%); box-shadow:0 10px 35px #0003; overflow:hidden; }
.duel-player { display:flex; flex-direction:column; min-height:0; padding:clamp(12px,.7vw,22px); gap:14px; border-color:#35525b; }
.duel-player.duel-active { border-color:#c6a367; box-shadow:inset 0 0 0 1px #a18e69,0 12px 35px #0004; }
.duel-player.duel-waiting { background:linear-gradient(145deg,#142835,#0c1f2c 85%); }
.duel-player-head { display:flex; justify-content:space-between; align-items:center; gap:12px; padding-bottom:12px; border-bottom:1px solid #38525f; }
.duel-player-title { display:flex; gap:12px; align-items:center; min-width:0; }
.duel-avatar { width:42px; height:42px; display:grid; place-items:center; border:1px solid #ab9468; border-radius:50%; color:#f2d8a0; flex-shrink:0; }
.duel-name { font-size:21px; font-weight:800; color:#ebeee7; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; max-width:24ch; }
.duel-status { color:#b2bec2; font-size:12px; line-height:1.8; }
.duel-active .duel-status { color:#f2d39b; }
.duel-score { display:flex; flex-direction:column; align-items:center; color:#efce8d; }
.duel-score b { font:34px Georgia,serif; }
.duel-score small { color:#a6b8bd; white-space:nowrap; font-size:11px; }
.duel-minor-head { display:flex; justify-content:space-between; align-items:center; gap:10px; min-width:0; padding:0 1px; margin-bottom:9px; }
.duel-minor-head b { font-size:14px; white-space:nowrap; color:#e6e8e5; }
.duel-minor-head span { color:#8fa7b0; font-size:11px; text-align:right; }
.duel-stock .resource-bar { padding:11px 13px; min-height:55px; gap:15px; }
.duel-stock .gem { width:19px; height:19px; }
.duel-zone { min-height:0; }
.duel-hand { flex:1.12 1 0; display:flex; flex-direction:column; }
.duel-played { flex:1 1 0; display:flex; flex-direction:column; border-top:1px solid #39505c; padding-top:13px; }
.duel-card-grid { min-height:0; overflow:auto; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); grid-auto-rows:minmax(170px, 1fr); align-content:start; gap:9px; padding:2px 3px 6px; scrollbar-width:thin; }
.duel-card-grid .merchant-card { min-height:176px; padding:9px; width:auto; }
.duel-card-grid .card-head { font-size:12px; }
.duel-card-grid .merchant-effect { min-height:77px; }
.duel-card-grid .card-foot { font-size:10px; }
.duel-card-grid .gem { width:14px; height:14px; margin:1px; }
.duel-card-grid .stone-gems { gap:3px; }
.duel-used-grid .merchant-card { min-height:162px; }

        return `<h2>升级水晶</h2><p>本张卡最多升级 <b>${card.steps}</b> 次，可连续升级同一颗水晶，例如 黄→绿→蓝。</p><div class="modal-progress">已使用 ${m.steps.length} / ${card.steps} 次</div><div class="modal-stock">${stones(m.draft)}</div><p class="modal-caption">点击要升级的水晶颜色：</p><div class="choice-row">${[0, 1, 2].map(c => `<button data-action="upgrade-step" data-color="${c}" ${m.kind === 'upgrade' && (m.steps.length >= card.steps || m.draft[c] === 0) ? 'disabled' : ''} class="choice-btn">${stones([0, 0, 0, 0].map((_, i) => i === c ? 1 : 0))} <span>→ ${COLOR[c + 1]}</span></button>`).join('')}</div><div class="modal-actions"><button class="secondary-btn" data-action="upgrade-undo" ${m.steps.length === 0 ? 'disabled' : ''}>撤销一步</button><button class="primary-btn" data-action="confirm-upgrade">确认打出</button></div>`;
    }
    if (m.kind === 'trade') {
        const card = MERCHANT_BY_ID[m.id];
        const max = tradeLimit(p.stock, m.id);
        const repeats = m.repeats;
        const forecast = p.stock.map((n, i) => n + (card.output[i] - card.input[i]) * repeats);
        return `<h2>交易水晶</h2><p>每次支付 <strong>${readable(card.input)}</strong>，获得 <strong>${readable(card.output)}</strong>。</p><div class="stepper"><button data-action="trade-minus" ${m.repeats <= 1 ? 'disabled' : ''}>−</button><strong>${m.repeats} <small>次</small></strong><button data-action="trade-plus" ${m.repeats >= max ? 'disabled' : ''}>+</button></div><p class="modal-caption">本次最多可交易 ${max} 次</p><div class="preview"><b>交易后水晶</b><div>${stones(forecast)}</div>${count(forecast) > 10 ? `<p class="warn">回合结束需弃置 ${count(forecast) - 10} 颗</p>` : ''}</div><div class="modal-actions"><button class="secondary-btn" data-action="cancel">取消</button><button class="primary-btn" data-action="confirm-trade">确认交易</button></div>`;
    }
    if (m.kind === 'acquire') {
        const target = game.merchantMarket[m.index];
        const used = [0, 0, 0, 0];
        m.payment.forEach(c => used[c]++);
        const remain = p.stock.map((n, i) => n - used[i]);
        return `<h2>获取商人卡</h2><p>获取第 <b>${m.index + 1}</b> 张：需向左侧每张商人卡各压 1 颗水晶，共 <b>${m.index}</b> 颗。</p><div class="preview"><b>${merchantDescription(MERCHANT_BY_ID[target.id])}</b><p>该卡附赠：${readable(target.bonus)}</p></div><div class="modal-progress">已选择 ${m.payment.length} / ${m.index} 颗</div><div class="modal-stock">${stones(remain)}</div><p class="modal-caption">按照从左到右的顺序选择支付水晶：</p><div class="choice-row">${[0, 1, 2, 3].map(c => `<button class="choice-btn" data-action="payment-pick" data-color="${c}" ${remain[c] === 0 || m.kind === 'acquire' && m.payment.length >= m.index ? 'disabled' : ''}>${stones([0, 0, 0, 0].map((_, i) => i === c ? 1 : 0))}</button>`).join('')}</div><p class="selected">${m.payment.length ? '已选择：' + m.payment.map(c => COLOR[c]).join(' → ') : '尚未选择'}</p><div class="modal-actions"><button class="secondary-btn" data-action="payment-undo" ${m.payment.length === 0 ? 'disabled' : ''}>撤销一颗</button><button class="primary-btn" data-action="confirm-acquire" ${m.payment.length !== m.index ? 'disabled' : ''}>确认获取</button></div>`;
    }
    const needed = count(p.stock) - 10;
    const used = [0, 0, 0, 0];
    m.colors.forEach(c => used[c]++);
    const remain = p.stock.map((n, i) => n - used[i]);
    return `<h2>商队容量管理</h2><p>水晶超过 10 颗，请自主选择弃置水晶。该次行动在弃置完成后结束。</p><div class="modal-progress">已选择弃置 ${m.colors.length} / ${needed} 颗</div><div class="modal-stock">${stones(remain)}</div><div class="choice-row">${[0, 1, 2, 3].map(c => `<button class="choice-btn" data-action="discard-pick" data-color="${c}" ${remain[c] === 0 || m.kind === 'discard' && m.colors.length >= needed ? 'disabled' : ''}>弃 ${COLOR[c]}</button>`).join('')}</div><p class="selected">${m.colors.length ? '已选择：' + m.colors.map(c => COLOR[c]).join('、') : '尚未选择'}</p><div class="modal-actions"><button class="secondary-btn" data-action="discard-undo" ${m.colors.length === 0 ? 'disabled' : ''}>撤销一颗</button><button class="primary-btn" data-action="confirm-discard" ${m.colors.length !== needed ? 'disabled' : ''}>确认弃置</button></div>`;
}
function renderRules() {
    return `<div class="overlay" data-overlay="help"><section class="dialog help-dialog"><button class="close-modal" data-action="close-help">✕</button><div class="eyebrow">RULE BOOK</div><h2>规则速览</h2><div class="help-rows"><p><b>四类行动：</b>每回合选择 打出、获取、休息、认领 中的一项。</p><p><b>打出：</b>创造获得水晶；升级可逐级、可连续升级同一颗；交易可在一回合重复多次。</p><p><b>获取：</b>目标左侧每张卡上压 1 颗任意水晶，目标卡上的累计水晶归获取者。</p><p><b>休息：</b>取回全部已打出商人卡，占用完整一回合。</p><p><b>认领：</b>精确支付魔像需求。左一铜币 +3 分，左二银币 +1 分；铜币耗尽后银币移至最左。</p><p><b>容量：</b>你的回合结束最多保留 10 颗，超过时自行选择弃置。</p><p><b>终局：</b>2–3 人局认领第 6 张、4–5 人局认领第 5 张触发；完成当前整轮后结算。</p><p><b>六人扩展：</b>2 真人 + 4 AI，按 5 人局触发终局，第六席使用复制起始卡和 4/5 席起始水晶。</p><p><b>计分：</b>魔像分 + 铜币×3 + 银币×1 + 剩余非黄水晶×1；平分时最后行动者获胜。</p></div><button class="primary-btn" data-action="close-help">返回游戏</button></section></div>`;
}
function render() {
    const scrolls = new Map();
    root.querySelectorAll('[data-scroll-zone]').forEach(el => scrolls.set(el.dataset.scrollZone, { top: el.scrollTop, left: el.scrollLeft }));
    root.innerHTML = `${game ? renderBoard(game) : renderSetup()}
    ${modal && game && !handoff && game.phase !== 'finished' ? `<div class="overlay" data-overlay="modal"><section class="dialog">${game.phase !== 'overflow' ? '<button class="close-modal" data-action="cancel">✕</button>' : ''}${modalBody()}</section></div>` : ''}
    ${showHelp ? renderRules() : ''}${toast ? `<div class="toast" role="alert">${esc(toast)}</div>` : ''}`;
    root.querySelectorAll('[data-scroll-zone]').forEach(el => { const at = scrolls.get(el.dataset.scrollZone); if (at) {
        el.scrollTop = at.top;
        el.scrollLeft = at.left;
    } });
    scheduleBot();
}
function save() { try {
    if (game)
        localStorage.setItem(KEY, JSON.stringify(game));
    else
        localStorage.removeItem(KEY);
}
catch { /* 可无存储运行 */ } }
function notify(message) { toast = message; render(); }
function action(a) {
    if (!game)
        return;
    try {
        const previous = game.current;
        game = applyAction(game, a);
        modal = game.phase === 'overflow' && !game.players[game.current].isAI ? { kind: 'discard', colors: [] } : null;
        handoff = game.players.length > 2 && game.current !== previous && game.phase !== 'finished' && !game.players[game.current].isAI && game.players.filter(p => !p.isAI).length > 2;
        toast = '';
        save();
        render();
    }
    catch (e) {
        notify(e instanceof Error ? e.message : '行动无法执行');
    }
}
function start() {
    const inputs = [...root.querySelectorAll('#nameInputs input')];
    try {
        const humans = Number(root.querySelector('#humanCount')?.value ?? inputs.length);
        const bots = Number(root.querySelector('#botCount')?.value ?? 0);
        const names = [...inputs.map(x => x.value), ...Array.from({ length: bots }, (_, i) => `AI 工匠 ${i + 1}`)];
        if (humans !== inputs.length)
            throw new Error('人类玩家人数无效');
        game = createGame(names, undefined, Array.from({ length: bots }, (_, i) => humans + i));
        modal = null;
        handoff = false;
        botPaused = false;
        showHelp = false;
        showLog = false;
        inspectedAI = null;
        toast = '';
        viewState.players = {};
        saveView();
        save();
        render();
    }
    catch (e) {
        notify(e instanceof Error ? e.message : '无法开始游戏');
    }
}
function control(target) {
    const type = target.dataset.action || '';
    if (type === 'start') {
        start();
        return;
    }
    if (type === 'inspect-ai') {
        const id = Number(target.dataset.player);
        inspectedAI = inspectedAI === id ? null : id;
        render();
        return;
    }
    if (type === 'toggle-log') {
        showLog = !showLog;
        render();
        return;
    }
    if (type === 'reset') {
        if (game?.phase !== 'finished' && !confirm('确定结束当前对局并重新开始吗？当前存档将被覆盖。'))
            return;
        game = null;
        handoff = false;
        showHelp = false;
        showLog = false;
        inspectedAI = null;
        modal = null;
        botPaused = false;
        toast = '';
        viewState.players = {};
        saveView();
        save();
        render();
        return;
    }
    if (type === 'help') {
        showHelp = true;
        render();
        return;
    }
    if (type === 'close-help') {
        showHelp = false;
        render();
        return;
    }
    if (type === 'ready') {
        handoff = false;
        render();
        return;
    }
    if (type === 'ai-pause') {
        botPaused = !botPaused;
        render();
        return;
    }
    if (type === 'card-size') {
        viewState.compact = !viewState.compact;
        saveView();
        render();
        return;
    }
    if (type === 'toggle-played') {
        const id = Number(target.dataset.player);
        if (game?.players[id]) {
            pref(id).folded = !pref(id).folded;
            saveView();
            render();
        }
        return;
    }
    if (type === 'move-card') {
        if (!modal && !handoff) {
            reorderHand(Number(target.dataset.player), target.dataset.id, Number(target.dataset.direction));
        }
        return;
    }
    if (type === 'group-cards') {
        const id = Number(target.dataset.player);
        if (game?.players[id] && !modal && !handoff && !game.players[id].isAI)
            updateHandOrder(id, groupOrder(game.players[id].hand, sortedHand(game.players[id]), card => MERCHANT_BY_ID[card].kind));
        return;
    }
    if (type === 'cancel') {
        if (game?.phase === 'overflow')
            return;
        modal = null;
        toast = '';
        render();
        return;
    }
    if (!game || game.phase === 'finished' || handoff || showHelp || game.players[game.current].isAI)
        return;
    if (game.phase === 'overflow' && !modal)
        modal = { kind: 'discard', colors: [] };
    const p = game.players[game.current];
    const idx = Number(target.dataset.index);
    const color = Number(target.dataset.color);
    if (type === 'rest') {
        action({ type: 'rest' });
        return;
    }
    if (type === 'claim') {
        action({ type: 'claim', index: idx });
        return;
    }
    if (type === 'get-merchant') {
        if (idx > count(p.stock)) {
            notify(`当前仅有 ${count(p.stock)} 颗水晶，支付不起市场位置费用`);
            return;
        }
        if (idx === 0) {
            action({ type: 'acquire', index: 0, payment: [] });
            return;
        }
        modal = { kind: 'acquire', index: idx, payment: [] };
        render();
        return;
    }
    if (type === 'play-hand') {
        const id = target.dataset.id;
        const card = MERCHANT_BY_ID[id];
        if (!card)
            return;
        if (card.kind === 'create') {
            action({ type: 'play', cardId: id });
            return;
        }
        if (card.kind === 'upgrade')
            modal = { kind: 'upgrade', id, steps: [], draft: [...p.stock] };
        else if (tradeLimit(p.stock, id) > 0)
            modal = { kind: 'trade', id, repeats: 1 };
        else {
            notify('现有水晶不足以执行该交易');
            return;
        }
        render();
        return;
    }
    if (!modal)
        return;
    if (modal.kind === 'upgrade') {
        if (type === 'upgrade-step' && modal.steps.length < MERCHANT_BY_ID[modal.id].steps && color <= 2 && modal.draft[color] > 0) {
            modal.draft[color]--;
            modal.draft[color + 1]++;
            modal.steps.push(color);
            render();
            return;
        }
        if (type === 'upgrade-undo' && modal.steps.length) {
            const c = modal.steps.pop();
            modal.draft[c]++;
            modal.draft[c + 1]--;
            render();
            return;
        }
        if (type === 'confirm-upgrade') {
            action({ type: 'play', cardId: modal.id, steps: modal.steps });
            return;
        }
    }
    if (modal.kind === 'trade') {
        if (type === 'trade-minus') {
            modal.repeats = Math.max(1, modal.repeats - 1);
            render();
            return;
        }
        if (type === 'trade-plus') {
            modal.repeats = Math.min(tradeLimit(p.stock, modal.id), modal.repeats + 1);
            render();
            return;
        }
        if (type === 'confirm-trade') {
            action({ type: 'play', cardId: modal.id, repeats: modal.repeats });
            return;
        }
    }
    if (modal.kind === 'acquire') {
        if (type === 'payment-pick' && modal.payment.length < modal.index) {
            const used = modal.payment.filter(c => c === color).length;
            if (used < p.stock[color]) {
                modal.payment.push(color);
                render();
            }
            return;
        }
        if (type === 'payment-undo') {
            modal.payment.pop();
            render();
            return;
        }
        if (type === 'confirm-acquire') {
            action({ type: 'acquire', index: modal.index, payment: modal.payment });
            return;
        }
    }
    if (modal.kind === 'discard') {
        if (type === 'discard-pick' && modal.colors.length < count(p.stock) - 10) {
            const used = modal.colors.filter(c => c === color).length;
            if (used < p.stock[color]) {
                modal.colors.push(color);
                render();
            }
            return;
        }
        if (type === 'discard-undo') {
            modal.colors.pop();
            render();
            return;
        }
        if (type === 'confirm-discard') {
            action({ type: 'discard', colors: modal.colors });
            return;
        }
    }
}
function scheduleBot() {
    if (botTimer !== null) {
        clearTimeout(botTimer);
        botTimer = null;
    }
    if (!game || game.phase === 'finished' || handoff || showHelp || modal || botPaused || !game.players[game.current]?.isAI)
        return;
    const expectedTurn = game.turnNumber;
    const expectedPlayer = game.current;
    botTimer = setTimeout(() => {
        botTimer = null;
        if (!game || game.turnNumber !== expectedTurn || game.current !== expectedPlayer || game.phase === 'finished' || handoff || showHelp || botPaused || !game.players[game.current]?.isAI)
            return;
        try {
            const choice = chooseAIAction(game);
            action(choice.action);
        }
        catch (e) {
            botPaused = true;
            notify(`AI 行动异常，已暂停：${e instanceof Error ? e.message : String(e)}`);
        }
    }, 480);
}
root.addEventListener('click', event => {
    const element = event.target;
    const target = element.closest('[data-action]');
    if (target && !target.hasAttribute('disabled')) {
        if (target.dataset.action === 'play-hand' && Date.now() < suppressPlayUntil)
            return;
        control(target);
    }
});
root.addEventListener('dragstart', event => {
    const tile = event.target.closest('[data-drag-player][data-card-id]');
    if (!tile || !game || modal || handoff || game.phase === 'finished') {
        event.preventDefault();
        return;
    }
    const player = Number(tile.dataset.dragPlayer);
    if (game.players[player]?.isAI) {
        event.preventDefault();
        return;
    }
    dragging = { player, id: tile.dataset.cardId };
    event.dataTransfer?.setData('text/plain', dragging.id);
    if (event.dataTransfer)
        event.dataTransfer.effectAllowed = 'move';
    tile.classList.add('tile-dragging');
});
root.addEventListener('dragover', event => {
    const tile = event.target.closest('[data-drag-player][data-card-id]');
    if (!tile || !dragging || dragging.player !== Number(tile.dataset.dragPlayer) || tile.dataset.cardId === dragging.id)
        return;
    event.preventDefault();
    if (event.dataTransfer)
        event.dataTransfer.dropEffect = 'move';
    root.querySelectorAll('.tile-drop-target').forEach(x => x.classList.remove('tile-drop-target'));
    tile.classList.add('tile-drop-target');
});
root.addEventListener('drop', event => {
    const tile = event.target.closest('[data-drag-player][data-card-id]');
    if (tile && dragging && dragging.player === Number(tile.dataset.dragPlayer)) {
        event.preventDefault();
        suppressPlayUntil = Date.now() + 350;
        const source = dragging;
        dragging = null;
        root.querySelectorAll('.tile-drop-target,.tile-dragging').forEach(x => x.classList.remove('tile-drop-target', 'tile-dragging'));
        reorderHand(source.player, source.id, undefined, tile.dataset.cardId);
    }
});
root.addEventListener('dragend', () => {
    dragging = null;
    suppressPlayUntil = Date.now() + 350;
    root.querySelectorAll('.tile-drop-target,.tile-dragging').forEach(x => x.classList.remove('tile-drop-target', 'tile-dragging'));
});
root.addEventListener('change', e => {
    const element = e.target;
    if (element.id !== 'humanCount' && element.id !== 'botCount')
        return;
    syncSetup();
});
render();
})();
</script></body>
</html>
