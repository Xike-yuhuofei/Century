/* V1.1: 全站水晶均按实际颗数绘制，而非「单颗 × 数量」。 */
.stone-group { display:inline-flex; align-items:center; vertical-align:middle; white-space:normal; flex-shrink:0; }
.stone-gems { display:inline-flex; flex-wrap:wrap; align-items:center; gap:6px; max-width:100%; }
.stone-line { justify-content:center; }
.merchant-card .stone-line { gap:7px; }
.merchant-card .stone-gems { gap:5px; }
.merchant-card .gem { width:16px; height:16px; margin:2px; }
.golem-card .stone-gems { gap:5px; justify-content:center; }
.golem-card .gem { width:16px; height:16px; margin:2px; }
.merchant-card .market-bonus .gem { width:13px; height:13px; margin:1px; }
.merchant-card.played-face { cursor:default; filter:saturate(.85); }
.merchant-card.played-face:hover,.merchant-card.inactive-face:hover { transform:none; border-color:#647379; }
.merchant-card.inactive-face { cursor:default; }

/* 双人桌布：左右各自独立的卡牌区，中间共享两个市场。 */
.layout.duel-layout { width:100%; max-width:none; margin:0 auto; padding:10px clamp(18px,1.05vw,42px) 16px; }
.duel-layout .topbar { height:64px; margin-bottom:11px; }
.duel-layout .brand-text strong { font-size:21px; }
.duel-now { margin-left:auto; border:1px solid #73654e; border-radius:8px; background:#332f2a; color:#f1d2a0; padding:9px 16px; font-size:15px; font-weight:750; }
.duel-layout .top-actions { margin-left:12px; }
.duel-table { display:grid; grid-template-columns:minmax(440px,1fr) minmax(790px,1.56fr) minmax(440px,1fr); align-items:stretch; gap:clamp(12px,.85vw,27px); height:calc(100dvh - 105px); min-height:800px; }
.duel-player,.duel-center { min-width:0; border:1px solid #2c5057; border-radius:17px; background:linear-gradient(145deg,#172e3c,#0f2330 85%); box-shadow:0 10px 35px #0003; overflow:hidden; }
.duel-player { display:flex; flex-direction:column; min-height:0; padding:clamp(12px,.7vw,22px); gap:14px; border-color:#35525b; }
.duel-player.duel-active { border-color:#c6a367; box-shadow:inset 0 0 0 1px #a18e69,0 12px 35px #0004; }
.duel-player.duel-waiting { background:linear-gradient(145deg,#142835,#0c1f2c 85%); }
.duel-player-head { display:flex; justify-content:space-between; align-items:center; gap:12px; padding-bottom:12px; border-bottom:1px solid #38525f; }
.duel-player-title { display:flex; gap:12px; align-items:center; min-width:0; }
.duel-avatar { width:42px; height:42px; display:grid; place-items:center; border:1px solid #ab9468; border-radius:50%; color:#f2d8a0; flex-shrink:0; }
.duel-name { font-size:21px; font-weight:800; color:#ebeee7; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; max-width:24ch; }
.duel-status { color:#b2bec2; font-size:12px; line-height:1.8; }
.duel-active .duel-status { color:#f2d39b; }
.duel-score { display:flex; flex-direction:column; align-items:center; color:#efce8d; }
.duel-score b { font:34px Georgia,serif; }
.duel-score small { color:#a6b8bd; white-space:nowrap; font-size:11px; }

.duel-minor-head b { font-size:14px; white-space:nowrap; color:#e6e8e5; }
.duel-minor-head span { color:#8fa7b0; font-size:11px; text-align:right; }
.duel-stock .resource-bar { padding:11px 13px; min-height:55px; gap:15px; }
.duel-stock .gem { width:19px; height:19px; }
.duel-zone { min-height:0; }
.duel-hand { flex:1.12 1 0; display:flex; flex-direction:column; }
.duel-played { flex:1 1 0; display:flex; flex-direction:column; border-top:1px solid #39505c; padding-top:13px; }
.duel-card-grid { min-height:0; overflow:auto; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); grid-auto-rows:minmax(170px, 1fr); align-content:start; gap:9px; padding:2px 3px 6px; scrollbar-width:thin; }
.duel-card-grid .merchant-card { min-height:176px; padding:9px; width:auto; }
.duel-card-grid .card-head { font-size:12px; }
.duel-card-grid .merchant-effect { min-height:77px; }
.duel-card-grid .card-foot { font-size:10px; }
.duel-card-grid .gem { width:14px; height:14px; margin:1px; }

.duel-used-grid .merchant-card { min-height:162px; }

        }
        if (type === 'confirm-acquire') {
            action({ type: 'acquire', index: modal.index, payment: modal.payment });
            return;
        }
    }
    if (modal.kind === 'discard') {
        if (type === 'discard-pick' && modal.colors.length < count(p.stock) - 10) {
            const used = modal.colors.filter(c => c === color).length;
            if (used < p.stock[color]) {
                modal.colors.push(color);
                render();
            }
            return;
        }
        if (type === 'discard-undo') {
            modal.colors.pop();
            render();
            return;
        }
        if (type === 'confirm-discard') {
            action({ type: 'discard', colors: modal.colors });
            return;
        }
    }
}
function scheduleBot() {
    if (botTimer !== null) {
        clearTimeout(botTimer);
        botTimer = null;
    }
    if (!game || game.phase === 'finished' || handoff || showHelp || showHistory || modal || botPaused || !game.players[game.current]?.isAI)
        return;
    const expectedTurn = game.turnNumber;
    const expectedPlayer = game.current;
    botTimer = setTimeout(() => {
        botTimer = null;
        if (!game || game.turnNumber !== expectedTurn || game.current !== expectedPlayer || game.phase === 'finished' || handoff || showHelp || showHistory || botPaused || !game.players[game.current]?.isAI)
            return;
        try {
            const choice = chooseAIAction(game);
            action(choice.action);
        }
        catch (e) {
            botPaused = true;
            notify(`AI 行动异常，已暂停：${e instanceof Error ? e.message : String(e)}`);
        }
    }, 480);
}
root.addEventListener('click', event => {
    const element = event.target;
    const target = element.closest('[data-action]');
    if (target && !target.hasAttribute('disabled')) {
        if (target.dataset.action === 'play-hand' && Date.now() < suppressPlayUntil)
            return;
        control(target);
    }
});
root.addEventListener('dragstart', event => {
    const tile = event.target.closest('[data-drag-player][data-card-id]');
    if (!tile || !game || modal || handoff || game.phase === 'finished') {
        event.preventDefault();
        return;
    }
    const player = Number(tile.dataset.dragPlayer);
    if (game.players[player]?.isAI) {
        event.preventDefault();
        return;
    }
    dragging = { player, id: tile.dataset.cardId };
    event.dataTransfer?.setData('text/plain', dragging.id);
    if (event.dataTransfer)
        event.dataTransfer.effectAllowed = 'move';
    tile.classList.add('tile-dragging');
});
root.addEventListener('dragover', event => {
    const tile = event.target.closest('[data-drag-player][data-card-id]');
    if (!tile || !dragging || dragging.player !== Number(tile.dataset.dragPlayer) || tile.dataset.cardId === dragging.id)
        return;
    event.preventDefault();
    if (event.dataTransfer)
        event.dataTransfer.dropEffect = 'move';
    root.querySelectorAll('.tile-drop-target').forEach(x => x.classList.remove('tile-drop-target'));
    tile.classList.add('tile-drop-target');
});
root.addEventListener('drop', event => {
    const tile = event.target.closest('[data-drag-player][data-card-id]');
    if (tile && dragging && dragging.player === Number(tile.dataset.dragPlayer)) {
        event.preventDefault();
        suppressPlayUntil = Date.now() + 350;
        const source = dragging;
        dragging = null;
        root.querySelectorAll('.tile-drop-target,.tile-dragging').forEach(x => x.classList.remove('tile-drop-target', 'tile-dragging'));
        reorderHand(source.player, source.id, undefined, tile.dataset.cardId);
    }
});
root.addEventListener('dragend', () => {
    dragging = null;
    suppressPlayUntil = Date.now() + 350;
    root.querySelectorAll('.tile-drop-target,.tile-dragging').forEach(x => x.classList.remove('tile-drop-target', 'tile-dragging'));
});
root.addEventListener('change', e => {
    const element = e.target;
    if (element.id !== 'humanCount' && element.id !== 'botCount')
        return;
    syncSetup();
});
mobileMedia.addEventListener('change', () => { if (!dedicatedMobilePage) {
    mobileTab = 'golems';
    mobileHandExpanded = false;
    mobilePlayedOpen = false;
    render();
} });
render();
})();
</script></body>
