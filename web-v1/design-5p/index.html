<script>

const verifiedCards=JSON.parse(document.getElementById('canonical-card-data').textContent);

const cardKind={'创造':'create','升级':'upgrade','交易':'trade'};
const merchant=Object.fromEntries([...verifiedCards.starters,...verifiedCards.merchants].map(c=>
  [c.id,{id:c.id,type:cardKind[c.type],input:asStock(c.input),output:asStock(c.output),up:c.upgrade_steps}]));
const golems=Object.fromEntries(verifiedCards.golems.map(c=>[c.id,{id:c.id,need:asStock(c.need),points:c.points}]));
if(verifiedCards.merchants.length!==43||verifiedCards.golems.length!==36||verifiedCards.starters.reduce((s,c)=>s+c.copies,0)!==10||
   merchant.M29.input[0]!==4||merchant.M29.output[2]!==2||merchant.M43.up!==3)throw Error('与核校卡表不一致');
function sum(s){return s.reduce((a,b)=>a+b,0)}
function enough(a,b){return b.every((n,i)=>a[i]>=n)}
function gems(s,size='',aria=true){return s.map((n,i)=>n?`<span class="resgroup" ${aria?`aria-label="${cn[i]}${n}颗"`:''}>${Array.from({length:n},()=>`<i aria-hidden="true" class="gem ${col[i]} ${size}"></i>`).join('')}</span>`:'').join('')||'<span style="color:#85959b;font-size:10px">—</span>'}
function nameOf(c){return {create:'创造',upgrade:'升级',trade:'交易'}[c.type]}
function cardHTML(id,mode='',extra=''){let c=merchant[id];if(!c)return '';return `<div class="mcard ${c.type} ${mode==='played'?'playedcard':''} ${extra}" tabindex="0" draggable="${mode==='hand'}" data-card="${id}" data-kind="${mode}" role="button" aria-label="${id} ${nameOf(c)}"><div class="mh"><span>${c.type==='create'?'✦':c.type==='upgrade'?'↟':'⇄'} ${nameOf(c)}</span><small>${id}</small></div><div class="m-effect">${c.type==='upgrade'?`<div class="upvalue">↟ ${c.up}</div><div class="upcaption">单级升级次数</div>`:c.type==='create'?`<div class="stones">${gems(c.output)}</div>`:`<div class="stones">${gems(c.input)}</div><div class="marr">↓</div><div class="stones">${gems(c.output)}</div>`}</div><div class="mf"><span>${mode==='played'?'已打出':mode==='market'?'获取':'商人卡'}</span><b>${mode==='hand'?'↗':' '}</b></div></div>`}

const data={players:structuredClone(pbase),ais:structuredClone(aibase),aiCount:3,active:0,selected:null,density:'normal',sort:['manual','manual'],market:['M01','M05','M12','M14','M22','M40'].map(id=>({id,bonus:[0,0,0,0]})),golem:['G08','G05','G13','G18','G31'],copper:8,silver:6,logs:['玩家 1 刚完成商队补充 · 当前可认领 2 张魔像'],work:null,turn:31};
const getScore=p=>p.claimed.reduce((s,id)=>s+golems[id].points,0)+p.copper*3+p.silver+p.stock.slice(1).reduce((a,b)=>a+b,0);

function personHTML(p,i){const current=data.active===i;const cards=data.sort[i]==='type'?[...p.hand].sort((a,b)=>({create:0,upgrade:1,trade:2}[merchant[a].type]-{create:0,upgrade:1,trade:2}[merchant[b].type])):[...p.hand];const sorted=[...p.pin.filter(v=>cards.includes(v)),...cards.filter(v=>!p.pin.includes(v))];return `<div class="personhead"><div class="identity"><div class="avatar">P0${i+1}</div><div><div class="person-name">${p.name}</div><div class="person-sub">${current?'<span class="on-dot"></span>当前操作席位':'等待行动'} · 已完成 ${p.turns} 回合</div></div></div><div class="score"><b>${getScore(p)}</b><small>分</small></div></div><div class="zone stock"><div class="sectionline"><b>商队水晶</b><span class="capacity ${sum(p.stock)>=10?'critical':''}">${sum(p.stock)} / 10</span></div><div class="resource">${gems(p.stock)}</div><div class="capacitybar"><span style="width:${Math.min(sum(p.stock),10)*10}%"></span></div></div><section class="zone cardszone hand"><div class="sectionline"><div class="cardsbar"><b>可用商人卡 · ${p.hand.length}</b></div><div class="cardsbar"><button class="micro ${data.sort[i]==='type'?'selected':''}" data-sort="${i}" title="切换按类型排序">类型</button><button class="micro ${data.sort[i]==='manual'?'selected':''}" data-manual="${i}" title="自由拖拽排序">手动</button></div></div><div class="cardgrid" data-list="${i}">${sorted.map(id=>cardHTML(id,'hand',p.pin.includes(id)?'pinned':'')).join('')}</div></section><section class="zone cardszone played ${p.fold?'collapsed':''}"><div class="sectionline"><b>已打出 · ${p.played.length} 张</b><button class="micro" data-fold="${i}">${p.fold?'展开 ↓':'收起 ↑'}</button></div><div class="cardgrid">${p.played.map(id=>cardHTML(id,'played')).join('')}</div></section><div class="footer-person"><div class="claims"><b>已认领魔像 · ${p.claimed.length} 张</b><span class="claimed-row">${p.claimed.map(id=>`<span class="claimmini" title="${id}">${golems[id].points}分</span>`).join('')} <span>铜 ${p.copper}　银 ${p.silver}</span></span></div><button class="rest" data-rest="${i}" ${!current||!p.played.length?'disabled':''}>休息 · 回收 ↗</button></div>`}
function aiHTML(a,i){const on=i<data.aiCount;return `<div class="aiseat ${on?'':'off'}" title="${on?`${a.name} · 已认领 ${a.claimed.join('、')} · 铜币${a.copper}银币${a.silver} · 手牌${a.hand}已打出${a.played}`:'空席'}"><div class="aitop"><div class="ainame"><span>0${i+3}</span>${on?a.name:'空席'}</div><span class="aiscore">${on?getScore(a):'—'}</span></div><div class="ailine"><span>水晶 ${on?sum(a.stock):0}/10</span><div class="aismall">${on?gems(a.stock,'tiny'):''}</div></div><div class="aifoot"><span>商人 ${on?a.hand+a.played:0}</span><span>魔像 ${on?a.claimed.length:0}</span><span>${on?'等待':'未加入'}</span></div></div>`}
function golemHTML(id,i){const c=golems[id],p=data.players[data.active],ok=enough(p.stock,c.need),def=c.need.map((n,j)=>Math.max(0,n-p.stock[j]));return `<button class="gcard ${ok?'available':''}" data-golem="${i}" aria-label="${id} ${c.points}分魔像"><div class="gc-top"><span>${i===0&&data.copper?`<i class="coin copper">铜币 +3</i>`:i===1&&data.silver?`<i class="coin silver">银币 +1</i>`:'魔像'}</span><span>${id}</span></div><div class="g-art">${golemArt(i)}</div><div class="g-num">${c.points}<small>分</small></div><div class="g-cost">${gems(c.need,'small')}</div><div class="g-short">${ok?'● 可直接认领':`缺 ${def.map((v,j)=>v?`${cn[j]}${v}`:'').filter(Boolean).join(' / ')}`}</div></button>`}
function workDefault(){return `<div class="wbmain"><div class="wbleft"><div class="wbtitle">从卡牌到决策，只需两步</div><div class="wbdetail">选择左右手牌，或点击中央的魔像 / 商人卡。交易、升级及市场位置费用在这里就地处理，不打断整张桌面。</div></div><div class="wbright"><span style="font-size:12px;color:#9cafb2">悬停查看大卡　·　拖动整理顺序</span></div></div>`}
function workHTML(){let w=data.work,p=data.players[data.active];if(!w)return workDefault();let title='',detail='',prev='',buttons='';
if(w.kind==='play'){const c=merchant[w.id];title=`${c.id} · ${nameOf(c)}`;const max=tradeLimit(p.stock,c);if(c.type==='create'){let after=p.stock.map((n,i)=>n+c.output[i]);detail='创造水晶：立即执行；商队超过 10 颗时，回合结束前需要弃置。';prev=`${gems(p.stock)} <span style="color:#ddb779">→</span> ${gems(after)}`;buttons=`<button class="wbbutton gold" data-confirm="play">打出卡牌 ↗</button>`}
else if(c.type==='trade'){w.n=Math.min(Math.max(1,w.n||1),Math.max(1,max));let after=p.stock.map((n,i)=>n+(c.output[i]-c.input[i])*w.n);detail=`本次最多交易 ${max} 次。${max===0?'当前水晶不满足交易条件。':'可调整连续交易次数。'}`;prev=`${gems(p.stock,'small')} <span>→</span> ${gems(after,'small')}`;buttons=`<div class="stepbox"><button class="wbbutton" data-step="-1" ${w.n<=1?'disabled':''}>−</button><strong>${w.n}</strong><button class="wbbutton" data-step="1" ${w.n>=max?'disabled':''}>+</button></div><button class="wbbutton gold" data-confirm="play" ${max===0?'disabled':''}>确认交易 ↗</button>`}
else {w.steps=w.steps||[];let after=[...p.stock];w.steps.forEach(j=>{after[j]--;after[j+1]++});detail=`至多 ${c.up} 次单级升级；可在同一颗水晶上连续升级。已选 ${w.steps.length} 次。`;prev=`${gems(p.stock,'small')} <span>→</span> ${gems(after,'small')}`;buttons=`${[0,1,2].map(j=>`<button class="wbbutton" data-up="${j}" ${after[j]===0||w.steps.length>=c.up?'disabled':''}>${cn[j]} ↑</button>`).join('')}<button class="wbbutton" data-undo="1" ${!w.steps.length?'disabled':''}>撤销</button><button class="wbbutton gold" data-confirm="play">确认升级 ↗</button>`}
} else if(w.kind==='acquire'){let target=data.market[w.i];title=`获取 ${target.id} · 位置 ${w.i+1}`;w.pay=w.pay||[];let left=p.stock.map((n,i)=>n-w.pay.filter(x=>x===i).length);detail=`需向目标左侧各卡压 1 颗水晶，共 ${w.i} 颗；已选 ${w.pay.length} / ${w.i} 颗。目标卡附赠晶石归你。`;prev=`剩余：${gems(left,'small')}　赠送：${gems(target.bonus,'tiny')}`;buttons=`${w.pay.length<w.i?[0,1,2,3].map(j=>`<button class="wbbutton" data-pay="${j}" ${!left[j]?'disabled':''}>${cn[j]} −1</button>`).join(''):''}<button class="wbbutton" data-payundo="1" ${!w.pay.length?'disabled':''}>撤销</button><button class="wbbutton gold" data-confirm="acquire" ${w.pay.length!==w.i?'disabled':''}>确认获取 ↗</button>`}
else if(w.kind==='discard'){let n=sum(p.stock)-10;w.chosen=w.chosen||[];let left=p.stock.map((v,j)=>v-w.chosen.filter(x=>x===j).length);title='商队容量 · 选择弃置';detail=`回合结束最多保留 10 颗水晶。还需弃置 ${n-w.chosen.length} 颗（可自主选择颜色）。`;prev=`保留：${gems(left,'small')}`;buttons=`${[0,1,2,3].map(j=>`<button class="wbbutton" data-discard="${j}" ${left[j]===0||w.chosen.length>=n?'disabled':''}>弃 ${cn[j]}</button>`).join('')}<button class="wbbutton" data-discauto="1">建议弃置</button><button class="wbbutton" data-discundo="1" ${!w.chosen.length?'disabled':''}>撤销</button><button class="wbbutton gold" data-confirm="discard" ${w.chosen.length!==n?'disabled':''}>完成弃置 ↗</button>`}
else if(w.kind==='golem'){let c=golems[data.golem[w.i]];title=`认领 ${c.id} · ${c.points} 分`;let delta=c.need.map((n,i)=>Math.max(0,n-p.stock[i]));detail=enough(p.stock,c.need)?'水晶满足要求。认领后支付对应水晶，获得魔像与该卡位置的硬币奖励。':`仍缺 ${delta.map((v,i)=>v?cn[i]+v:'').filter(Boolean).join('、')}；当前无法认领。`;prev=`需求：${gems(c.need,'small')}`;buttons=`<button class="wbbutton gold" data-confirm="golem" ${!enough(p.stock,c.need)?'disabled':''}>确认认领 ↗</button>`}
return `<div class="wbmain"><div class="wbleft"><div class="wbtitle">${title}</div><div class="wbdetail">${detail}</div><div class="wbpreview">${prev}</div></div><div class="wbright">${buttons}<button class="wbbutton" data-close="1">取消</button></div></div>`}
function centerHTML(){return `<div class="ai-header"><b>AI 对手 <span style="color:#d8c28f">${data.aiCount} / 3</span></b><small>固定顶部席位 · 不影响真人操作区</small></div><div class="airow ${data.aiCount===0?'noshow':''}" style="grid-template-columns:repeat(${Math.max(1,data.aiCount)},minmax(0,1fr))">${data.ais.filter((a,i)=>i<data.aiCount).map(aiHTML).join('')}</div><section class="market golemmarket"><div class="market-title"><b><span class="accentdot"></span>魔像 · 认领市场</b><small>5 张常驻 · 左两席有硬币奖励</small></div><div class="golemrow">${data.golem.map(golemHTML).join('')}</div></section><section class="market merchantmarket"><div class="market-title"><b><span class="accentdot" style="background:#8cb9c0"></span>商人 · 获取市场</b><small>6 张常驻 · 向左逐张支付水晶</small></div><div class="merchantrow">${data.market.map((it,i)=>`<div class="marketmerch">${cardHTML(it.id,'market')}<div class="bonus">${sum(it.bonus)?gems(it.bonus,'tiny'):''}</div><div class="position">${i===0?'<b>免费</b>':`费用 <b>${i} 颗</b>`}</div></div>`).join('')}</div></section><section class="workbench"><div class="wbhead"><b>操作台 · ${data.players[data.active].name}</b><small>一次点击预览 · 再次点击确认</small></div>${workHTML()}</section><div class="logs"><strong>最近行动</strong><span>${data.logs[0]||'—'}</span></div>`}
function render(){const root=document.getElementById('app');root.dataset.density=data.density;document.getElementById('p1').innerHTML=personHTML(data.players[0],0);document.getElementById('p2').innerHTML=personHTML(data.players[1],1);document.getElementById('p1').classList.toggle('active',data.active===0);document.getElementById('p2').classList.toggle('active',data.active===1);document.getElementById('center').innerHTML=centerHTML();document.getElementById('aiCount').value=data.aiCount;document.getElementById('turntitle').textContent=`第 ${data.turn} 轮 · ${data.players[data.active].name} 行动中`;document.getElementById('density').textContent=data.density==='dense'?'标准密度':'紧凑模式';}
function tradeLimit(s,c){if(c.type!=='trade')return 0;return Math.min(10,...c.input.map((n,i)=>n?Math.floor(s[i]/n):10))}
function log(s){data.logs.unshift(s);if(data.logs.length>20)data.logs.pop()}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.remove('noshow');clearTimeout(toast.tid);toast.tid=setTimeout(()=>t.classList.add('noshow'),2600)}
function nextTurn(){data.players[data.active].turns++;data.active=1-data.active;data.turn++;data.work=null}
function finishOrOverflow(p){if(sum(p.stock)>10){data.work={kind:'discard',chosen:[]};toast('商队超过 10 颗，请自主选择需要弃置的水晶');render();return}nextTurn();render()}
function confirmWork(){let w=data.work;if(!w)return;let p=data.players[data.active];if(w.kind==='discard'){let n=sum(p.stock)-10;if(w.chosen.length!==n)return;for(const j of w.chosen)p.stock[j]--;log(`${p.name} 主动弃置 ${n} 颗水晶`);nextTurn();render();return}if(w.kind==='play'){let c=merchant[w.id];if(!p.hand.includes(w.id))return;if(c.type==='create')p.stock=p.stock.map((v,i)=>v+c.output[i]);else if(c.type==='trade'){if(tradeLimit(p.stock,c)<w.n)return;p.stock=p.stock.map((v,i)=>v+(c.output[i]-c.input[i])*w.n)}else{for(const j of(w.steps||[])){if(!p.stock[j])return;p.stock[j]--;p.stock[j+1]++}}p.hand=p.hand.filter(id=>id!==w.id);p.played.push(w.id);log(`${p.name} 打出 ${w.id} ${nameOf(c)}`);}else if(w.kind==='acquire'){if(w.pay.length!==w.i)return;let it=data.market[w.i];if(!it)return;for(let j=0;j<w.pay.length;j++){p.stock[w.pay[j]]--;data.market[j].bonus[w.pay[j]]++}p.stock=p.stock.map((v,i)=>v+it.bonus[i]);p.hand.push(it.id);data.market.splice(w.i,1);let next=['M03','M08','M10','M11','M13','M16','M27','M31','M32'].find(id=>!data.market.some(x=>x.id===id)&&!data.players.some(x=>x.hand.includes(id)||x.played.includes(id)));if(next)data.market.push({id:next,bonus:[0,0,0,0]});log(`${p.name} 获取商人卡 ${it.id}`)}else if(w.kind==='golem'){let id=data.golem[w.i],c=golems[id];if(!enough(p.stock,c.need))return;p.stock=p.stock.map((v,i)=>v-c.need[i]);p.claimed.push(id);if(w.i===0&&data.copper){p.copper++;data.copper--}else if(w.i===1&&data.silver){p.silver++;data.silver--}data.golem.splice(w.i,1);let next=['G07','G11','G12','G16','G17','G19','G21'].find(id=>!data.golem.includes(id)&&!data.players.some(x=>x.claimed.includes(id))&&!data.ais.some(x=>x.claimed.includes(id)));if(next)data.golem.push(next);log(`${p.name} 认领魔像 ${id}`)}finishOrOverflow(p)}
document.addEventListener('click',e=>{const t=e.target.closest('[data-card],[data-golem],[data-sort],[data-manual],[data-fold],[data-rest],[data-step],[data-up],[data-undo],[data-pay],[data-payundo],[data-discard],[data-discauto],[data-discundo],[data-confirm],[data-close]');if(!t)return;if(t.matches('button:disabled'))return;if(data.work?.kind==='discard'&&!t.matches('[data-discard],[data-discauto],[data-discundo],[data-confirm]'))return;let p=data.players[data.active];if(t.dataset.sort!==undefined){data.sort[+t.dataset.sort]='type'}else if(t.dataset.manual!==undefined){data.sort[+t.dataset.manual]='manual'}else if(t.dataset.fold!==undefined){data.players[+t.dataset.fold].fold=!data.players[+t.dataset.fold].fold}else if(t.dataset.rest!==undefined){let i=+t.dataset.rest;if(i!==data.active)return;let q=data.players[i];if(!q.played.length)return;q.hand.push(...q.played);q.played=[];log(`${q.name} 休息并回收商人卡`);nextTurn()}else if(t.dataset.card){let id=t.dataset.card;if(t.dataset.kind==='hand'&&data.players[data.active].hand.includes(id)){data.work={kind:'play',id,n:1,steps:[]}}else if(t.dataset.kind==='market'){let i=data.market.findIndex(x=>x.id===id);if(i>=0){data.work={kind:'acquire',i,pay:[]}}}}else if(t.dataset.golem!==undefined){data.work={kind:'golem',i:+t.dataset.golem}}else if(t.dataset.step){if(data.work?.kind==='play')data.work.n=Math.max(1,data.work.n+Number(t.dataset.step))}else if(t.dataset.up!==undefined){if(data.work?.kind==='play'){const j=+t.dataset.up;const c=merchant[data.work.id];let s=[...p.stock];data.work.steps.forEach(k=>{s[k]--;s[k+1]++});if(s[j]>0&&data.work.steps.length<c.up)data.work.steps.push(j)}}else if(t.dataset.undo){data.work?.steps?.pop()}else if(t.dataset.pay!==undefined){if(data.work?.kind==='acquire'){const j=+t.dataset.pay,count=data.work.pay.filter(x=>x===j).length;if(count<p.stock[j]&&data.work.pay.length<data.work.i)data.work.pay.push(j)}}else if(t.dataset.payundo){data.work?.pay?.pop()}else if(t.dataset.discard!==undefined){if(data.work?.kind==='discard'){const j=+t.dataset.discard,n=sum(p.stock)-10;const count=data.work.chosen.filter(x=>x===j).length;if(count<p.stock[j]&&data.work.chosen.length<n)data.work.chosen.push(j)}}else if(t.dataset.discauto){if(data.work?.kind==='discard'){let n=sum(p.stock)-10;data.work.chosen=[];for(let j=0;j<4;j++)for(let k=0;k<p.stock[j]&&data.work.chosen.length<n;k++)data.work.chosen.push(j)}}else if(t.dataset.discundo){data.work?.chosen?.pop()}else if(t.dataset.confirm){confirmWork();return}else if(t.dataset.close){data.work=null}render()});
document.getElementById('aiCount').addEventListener('change',e=>{data.aiCount=Math.max(0,Math.min(3,Number(e.target.value)||0));data.work=null;render()});document.getElementById('density').onclick=()=>{data.density=data.density==='normal'?'dense':'normal';render()};document.getElementById('switchTurn').onclick=()=>{data.active=1-data.active;data.work=null;render()};document.getElementById('reset').onclick=()=>location.reload();
let dragging=null, dragMoved=false;document.addEventListener('dragstart',e=>{const t=e.target.closest('.mcard[data-kind="hand"]');if(!t)return;dragging={id:t.dataset.card,owner:t.closest('[data-list]').dataset.list};dragMoved=true;t.classList.add('dragging');e.dataTransfer.effectAllowed='move'});document.addEventListener('dragover',e=>{const t=e.target.closest('.mcard[data-kind="hand"]');if(!dragging||!t||t.closest('[data-list]').dataset.list!==dragging.owner)return;e.preventDefault();t.classList.add('drop-target')});document.addEventListener('dragleave',e=>{e.target.closest('.mcard')?.classList.remove('drop-target')});document.addEventListener('drop',e=>{const t=e.target.closest('.mcard[data-kind="hand"]');if(!dragging||!t)return;e.preventDefault();const i=+dragging.owner;if(t.closest('[data-list]').dataset.list!==dragging.owner)return;const arr=data.players[i].hand;const old=arr.indexOf(dragging.id),n=arr.indexOf(t.dataset.card);if(old>=0&&n>=0&&old!==n){arr.splice(old,1);arr.splice(n,0,dragging.id);data.sort[i]='manual';log(`玩家 ${i+1} 已调整商人卡顺序`)}dragging=null;render()});document.addEventListener('dragend',()=>{dragging=null;setTimeout(()=>dragMoved=false,0);render()});
const tip=document.getElementById('tip');document.addEventListener('pointerover',e=>{let t=e.target.closest('.mcard');if(!t||e.pointerType==='touch')return;if(dragging)return;let r=t.getBoundingClientRect();tip.innerHTML=cardHTML(t.dataset.card,'hover');tip.style.display='block';let x=r.left+r.width/2-117,y=r.top-215;if(y<8)y=r.bottom+8;x=Math.min(Math.max(x,8),innerWidth-242);tip.style.left=x+'px';tip.style.top=Math.min(y,innerHeight-210)+'px'});document.addEventListener('pointerout',e=>{if(e.target.closest('.mcard')&&!e.relatedTarget?.closest?.('.mcard'))tip.style.display='none'});document.addEventListener('pointerdown',e=>{if(e.target.closest('.mcard'))tip.style.display='none'});
document.addEventListener('contextmenu',e=>{const c=e.target.closest('.mcard[data-kind="hand"]');if(!c)return;e.preventDefault();const list=c.closest('[data-list]');if(!list)return;const i=+list.dataset.list,p=data.players[i],id=c.dataset.card;if(p.pin.includes(id)){p.pin=p.pin.filter(x=>x!==id);toast(`已解除 ${id} 固定`)}else{p.pin.push(id);toast(`已固定 ${id} · 右键可解除`)}render()});
render();
</script></body></html>
