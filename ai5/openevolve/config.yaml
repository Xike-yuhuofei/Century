# Century AI5 × OpenEvolve 集成配置
# 演化目标：web-v1/src/ai/evaluator.ts 的商人卡获取估值函数 acquisitionValue
# 运行方式见 README.md；所有 LLM 调用走 codex app-server（ChatGPT 登录，无 API Key）。

max_iterations: 10
checkpoint_interval: 2
diff_based_evolution: true
max_code_length: 12000
# 安全硬开关（目标书第五节）：OpenEvolve 默认 enforce_evolve_blocks=false，
# 这里显式开启 —— 演化只允许改写 EVOLVE-BLOCK 内的 acquisitionValue 函数。
enforce_evolve_blocks: true

llm:
  # Codex App Server 接入（首选）：经 codex CLI app-server 子进程，
  # 认证完全由 CLI 的 ChatGPT 登录管理，本配置不含任何密钥。
  provider: "codex_app_server"
  models:
    # 经 model/list 实测该 ChatGPT 账户可用：gpt-5.6-sol（默认）/ gpt-5.6-terra
    # reasoning_effort=low（实测 medium 档大 prompt 生成超过 300s 导致重试堆积）
    - name: "gpt-5.6-sol"
      weight: 1.0
      timeout: 600
      reasoning_effort: "low"
  temperature: 0.7
  max_tokens: 16000

prompt:
  language: "typescript"
  system_message: >-
    You are an expert game-AI algorithm researcher improving the merchant-card
    acquisition value function `acquisitionValue` of the Century board game AI
    (5-player game, TypeScript). The function scores each market merchant card;
    higher scores bias the planner toward acquiring that card. Improve the
    heuristic while respecting these HARD constraints, violations cause
    immediate disqualification: (1) keep the exact function signature and
    export name, including the 7th optional parameter
    `model: EngineModelContext | null = null`; (2) only use the parameters and
    in-scope helpers documented in the file header (MERCHANT_BY_ID, GOLEM_BY_ID,
    VALUES, weighted, stockCount, cloneStock, engineValue, types Golem/Stock/
    PressureModel/AIParameters/EngineModelContext); (3) no imports, no eval, no
    process/network/fs/clock/random access; (4) the function must stay pure and
    deterministic; (5) do not hardcode card ids; (6) weighted parameters
    (params.engineWeight etc.) must remain wired in; (7) if you use `model`,
    keep it nil-safe and do not assume it is always present.
    Evaluation: candidates are compiled with the official game rules engine,
    probed on deterministic states, then play paired focus-seat games against
    the reigning champion AI in a sandbox (A=candidate at focus seat,
    B=champion at the same seat, same seed/opponents). combined_score is driven
    by the paired first-place-rate delta, not by average score; anomalies,
    latency and bloat are penalties. Small
    principled changes beat large speculative rewrites.

# 评估级联：stage1 静态+编译+探针（阈值 0.5，未过即淘汰）；
# stage2 快筛对战 32 局（阈值 0.45）；stage3 深评对战 96 局。
evaluator:
  timeout: 1200
  cascade_evaluation: true
  cascade_thresholds: [0.5, 0.45]
  max_retries: 1

database:
  population_size: 12
  archive_size: 6
  num_islands: 2
  elite_selection_ratio: 0.2
  exploitation_ratio: 0.7
  similarity_threshold: 0.99
