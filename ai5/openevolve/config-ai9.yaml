# Century AI 9.0 × OpenEvolve 多模块联合进化配置
# 演化对象：web-v1/src/ai/evolve/modules.ts、evaluator.ts、knowledge.ts 中注册的
# 12 个决策模块函数；一个 program 可含多个 EVOLVE-BLOCK，每块 = 一个模块。
# 运行方式见 training/evolution/openevolve-multi-bridge.mjs；LLM 走 codex 登录。

max_iterations: 6
checkpoint_interval: 1
diff_based_evolution: true
max_code_length: 40000
enforce_evolve_blocks: true

llm:
  provider: "codex_app_server"
  models:
    # 36h 长周期按权重轮换同一账号下已验证可用的 5.6 系列模型：
    # sol 为主，terra/luna 分摊额度；额度窗口耗尽时由生成器显式降级为确定性 pair。
    - name: "gpt-5.6-sol"
      weight: 0.5
      timeout: 900
      reasoning_effort: "low"
    - name: "gpt-5.6-terra"
      weight: 0.3
      timeout: 900
      reasoning_effort: "low"
    - name: "gpt-5.6-luna"
      weight: 0.2
      timeout: 900
      reasoning_effort: "low"
  temperature: 0.7
  max_tokens: 20000

prompt:
  language: "typescript"
  system_message: >-
    You are an expert game-AI algorithm researcher improving the Century board
    game AI (2-5 players, TypeScript). The program contains multiple EVOLVE-BLOCK
    sections; each block is exactly one registered decision module. Improve the
    modules jointly or independently. HARD constraints, violations cause
    immediate disqualification: (1) keep the exact function name, export form and
    parameter list of every block; (2) do not add/remove/reorder blocks; (3) only
    use the in-scope helpers listed in each module contract; (4) no imports, eval,
    process/network/fs/clock/random access, no hidden deck fields, no template
    strings; (5) every function must stay pure, deterministic and finite; (6) do
    not hardcode card/golem ids; (7) keep weighted parameters wired in; (8)
    modules marked with a neutral default should preserve the existing behaviour
    unless you have a principled improvement. Evaluation: candidates are
    statically checked, assembled into an isolated source tree, compiled with the
    official rules engine, probed on public deterministic states, then play paired
    focus-seat games against the reigning frozen champion in 2/3/4/5-player modes
    (same seed, same opponents, same seat). combined_score is driven by the paired
    first-place-rate delta, not average score. Small principled changes beat large
    speculative rewrites. The AI may only use public information.

# 级联：stage1 静态+编译+多模块探针；stage2 32 局真实对局；stage3 96 局。
evaluator:
  timeout: 9000
  cascade_evaluation: true
  cascade_thresholds: [0.5, 0.45]
  max_retries: 1

database:
  population_size: 16
  archive_size: 8
  num_islands: 3
  elite_selection_ratio: 0.2
  exploitation_ratio: 0.7
  similarity_threshold: 0.99
