name: Offline AI V2.0 tests
on:
  push:
    branches:
      - main
      - feature/ai-v2-beam-search-20261019
    paths:
      - 'web-v1/**'
      - '.github/workflows/ai-v2.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: web-v1
        run: npm install --no-audit --no-fund
      - name: Build and test real game engine and V2 planner
        working-directory: web-v1
        run: npm test
      - name: Check generated offline standalone includes planner
        working-directory: web-v1
        run: |
          node -e "const fs=require('fs');const html=fs.readFileSync('dist/standalone.html','utf8');if(!html.includes('function choosePlan('))process.exit(1)"
      - name: Small seeded V1/V2 benchmark (diagnostic)
        working-directory: web-v1
        run: node scripts/benchmark-ai.mjs 2
