name: Focus UI and AI integration
on:
  push:
    branches:
      - main
      - feature/v1-ai-opponents-20261019
    paths:
      - 'web-v1/**'
      - '.github/workflows/web-v1-ai.yml'
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install TypeScript
        working-directory: web-v1
        run: npm install --no-audit --no-fund
      - name: Compile and run rule/AI tests
        working-directory: web-v1
        run: npm test
      - name: Install Playwright for live five-player smoke
        run: python -m pip install playwright==1.56.0
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Test Focus interactions and player modes
        working-directory: web-v1
        run: |
          python scripts/live-five-smoke.py
          python scripts/smoke_focus.py
          python scripts/smoke_organize.py
