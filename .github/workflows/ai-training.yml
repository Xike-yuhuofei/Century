name: AI 4.0 auto training

# 定时训练/周挑战/自动晋级（非 CI）。
# PR 验证统一由 .github/workflows/ci.yml 负责；本工作流不再在 pull_request 上触发，
# 避免同一提交重复执行 web/training 大规模测试与共享构建。
on:
  schedule:
    # 每日 02:00 UTC 参数优化训练（约 40 分钟预算）
    - cron: '0 2 * * *'
    # 每周一 03:00 UTC 大规模冠军挑战
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        type: choice
        default: evolve
        options: [evolve, challenge]
      generations:
        description: '进化代数（1-30）'
        default: '3'
      population:
        description: '每代候选数（1-64）'
        default: '8'
      games-per-candidate:
        description: '每候选快速筛选种子数（×2 局，1-200）'
        default: '20'
      confirm-seeds:
        description: '确认挑战种子数（×2 局，1-500；默认 80 = 决定性下限 60 + 平局/异常余量）'
        default: '80'
      challenge-seeds:
        description: 'challenge 模式种子数（×2 局，1-500）'
        default: '100'
      time-budget-min:
        description: '时间预算（分钟，5-55）'
        default: '40'
      pool-size:
        description: '训练对手池大小（1=仅冠军，2-8）'
        default: '5'

# 默认只读；写权限仅在 promote 任务内显式声明。
permissions:
  contents: read
  actions: read

concurrency:
  group: ai-training
  cancel-in-progress: false

jobs:
  evolve:
    if: github.event_name == 'schedule' && github.event.schedule == '0 2 * * *' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'evolve')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-v1/package-lock.json
      - name: 构建 web-v1（训练与正式游戏共用同一编译产物）
        working-directory: web-v1
        run: npm ci --no-audit --no-fund && npm run build
      - name: 校验手动输入（白名单：纯数字 + 范围，经环境变量传递，杜绝注入 Shell）
        env:
          GENERATIONS: ${{ inputs.generations || '3' }}
          POPULATION: ${{ inputs.population || '8' }}
          GAMES_PER_CANDIDATE: ${{ inputs['games-per-candidate'] || '20' }}
          CONFIRM_SEEDS: ${{ inputs['confirm-seeds'] || '80' }}
          TIME_BUDGET_MIN: ${{ inputs['time-budget-min'] || '40' }}
          POOL_SIZE: ${{ inputs['pool-size'] || '5' }}
        run: |
          check() {
            name="$1"; value="$2"; low="$3"; high="$4"
            case "$value" in ''|*[!0-9]*) echo "输入 $name 非法：必须是正整数，实际 '$value'"; exit 1;; esac
            if [ "$value" -lt "$low" ] || [ "$value" -gt "$high" ]; then
              echo "输入 $name 超出允许范围 [$low, $high]：$value"; exit 1
            fi
          }
          check GENERATIONS "$GENERATIONS" 1 30
          check POPULATION "$POPULATION" 1 64
          check GAMES_PER_CANDIDATE "$GAMES_PER_CANDIDATE" 1 200
          check CONFIRM_SEEDS "$CONFIRM_SEEDS" 1 500
          check TIME_BUDGET_MIN "$TIME_BUDGET_MIN" 5 55
          check POOL_SIZE "$POOL_SIZE" 1 8
      # 定时训练前只跑轻量可靠性门禁（卡表 + dev 审计，约 1 分钟），
      # 不再重复 CI 已覆盖的 web/training 全量测试（原先串行约 24 分钟）。
      - name: 启动前轻量门禁（卡表 + dev 审计）
        run: |
          node web-v1/scripts/sync-cards.mjs --check
          node training/redteam/audit-gate.mjs --tier dev --json training/reports/audit-gate-scheduled.json --md training/reports/audit-gate-scheduled.md
      - name: 下载上次训练状态（断点续训 + 验证种子账本）
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p training/state-prev
          found=0
          for run_id in $(gh run list --workflow=ai-training.yml --status=success -L 10 --json databaseId --jq '.[].databaseId'); do
            if gh run download "$run_id" --name evolve-state-latest --dir training/state-prev 2>/dev/null; then
              echo "已恢复 run $run_id 的训练状态"; found=1; break
            fi
          done
          [ "$found" = "1" ] || echo "无可用历史状态，从全新状态开始（种子基数仍按日期递进）"
      - name: 参数进化训练（每日种子递进 + 断点续训 + 时间预算安全退出）
        env:
          GENERATIONS: ${{ inputs.generations || '3' }}
          POPULATION: ${{ inputs.population || '8' }}
          GAMES_PER_CANDIDATE: ${{ inputs['games-per-candidate'] || '20' }}
          CONFIRM_SEEDS: ${{ inputs['confirm-seeds'] || '80' }}
          TIME_BUDGET_MIN: ${{ inputs['time-budget-min'] || '40' }}
          POOL_SIZE: ${{ inputs['pool-size'] || '5' }}
        run: |
          seed_base=$(date +%Y%m%d)
          resume_args=()
          if [ -f training/state-prev/state.json ]; then
            resume_args+=(--resume training/state-prev/state.json)
            echo "续训：从上次状态继续（种子游标与精英池继承）"
          fi
          if [ -f training/state-prev/validation-ledger.json ]; then
            resume_args+=(--seed-ledger training/state-prev/validation-ledger.json)
            echo "验证种子账本：从上次消费位置续接（种子块不可复用）"
          fi
          node training/optimizer/evolve-cli.mjs \
            --generations "$GENERATIONS" \
            --population "$POPULATION" \
            --games-per-candidate "$GAMES_PER_CANDIDATE" \
            --confirm-seeds "$CONFIRM_SEEDS" \
            --time-budget-min "$TIME_BUDGET_MIN" \
            --pool-size "$POOL_SIZE" \
            --seed-base "$seed_base" \
            "${resume_args[@]}" \
            --out "training/reports/evolve-$(date +%Y%m%d)"
      - name: 归集训练状态（供次日续训）
        if: always()
        run: |
          mkdir -p training/state
          cp training/reports/evolve-*/state.json training/state/ 2>/dev/null || true
          cp training/reports/evolve-*/validation-ledger.json training/state/ 2>/dev/null || true
      - name: 上传训练状态
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evolve-state-latest
          path: training/state/
          retention-days: 30
          if-no-files-found: ignore
      - name: 上传训练产物
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evolve-${{ github.run_id }}
          path: |
            training/reports/evolve-*/
          if-no-files-found: warn
          retention-days: 30

  promote:
    needs: evolve
    if: needs.evolve.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-v1/package-lock.json
      - name: 构建 web-v1（晋级脚本需要编译产物）
        working-directory: web-v1
        run: npm ci --no-audit --no-fund && npm run build
      - name: 下载训练产物
        uses: actions/download-artifact@v4
        with:
          name: evolve-${{ github.run_id }}
          path: training/reports/
      - name: 检查第一名率晋级证据是否存在
        id: candidate
        run: |
          dir=training/reports/first-place-promotion/latest
          if [ -s "$dir/challenge-evidence.json" ] && [ -s "$dir/preregistration.json" ] && [ -s "$dir/candidate.json" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "dir=$dir" >> "$GITHUB_OUTPUT"
            candidate_id=$(node -p "JSON.parse(require('fs').readFileSync('$dir/candidate.json','utf8')).parameters?.id ?? JSON.parse(require('fs').readFileSync('$dir/candidate.json','utf8')).id")
            echo "id=$candidate_id" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "没有第一名率正式挑战证据：保留当前冠军，不晋级。"
          fi
      - name: 机器门禁晋级（第一名率证据复核 + 归档 + 参数区落地 + 终检）
        if: steps.candidate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVIDENCE_DIR: ${{ steps.candidate.outputs.dir }}
          CANDIDATE_ID: ${{ steps.candidate.outputs.id }}
        run: |
          git config user.name "century-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          branch="ai-champion/${CANDIDATE_ID}-$(date +%Y%m%d%H%M)"
          node training/scripts/promote-first-place-champion.mjs \
            --evidence "$EVIDENCE_DIR/challenge-evidence.json" \
            --plan "$EVIDENCE_DIR/preregistration.json" \
            --candidate "$EVIDENCE_DIR/candidate.json"
          node training/scripts/apply-champion.mjs --champion training/champions/champion.json
          (cd web-v1 && npm ci --no-audit --no-fund && npm run build)
          node training/scripts/apply-champion.mjs --check
          node training/scripts/refresh-champion-provenance.mjs
          node training/redteam/audit-gate.mjs --tier promotion --json training/reports/audit-gate-promote.json
          git checkout -b "$branch"
          git add training/champions/ web-v1/src/ai/parameters.ts web-v1/dist training/reports/
          git commit -m "feat(ai8): 第一名率晋级冠军 ${CANDIDATE_ID}（机器门禁，无人工审批）"
          git push origin "$branch"
          {
            echo "## 第一名率冠军晋级：${CANDIDATE_ID}"
            echo
            echo "### 主判据"
            echo '2–5 人配对第一名率增量（预注册 + 固定样本 + 几何 alpha 消耗）；平均得分/资源效率仅诊断。'
            echo
            echo '### 完整证据'
            node -e "const d=require('./$EVIDENCE_DIR/challenge-evidence.json');console.log('\`\`\`json\\n'+JSON.stringify(d.decision,null,2)+'\\n\`\`\`')"
            echo '### 机器门禁'
            echo '- promotion-gate：结构化审计 verdict 必须为 PASS'
            echo '- promotion-machine-gate：独立重算第一名率证据、alpha 账本、种子治理、构建身份'
            echo '- 全部必需检查通过后自动 squash merge；无人工批准、无管理员强制合并'
          } > pr-body.md
          pr_url=$(gh pr create --title "第一名率冠军晋级：${CANDIDATE_ID}" --body-file pr-body.md --base main --head "$branch")
          echo "候选 PR：$pr_url"
          gh workflow run ci.yml --ref "$branch" -f promotion=true || {
            echo "::error::无法 dispatch ci.yml";
            exit 1
          }
          gh pr merge "$pr_url" --squash --auto
          echo "已启用 auto-merge：全部机器检查通过后自动合并并触发 Pages 部署。"

  challenge:
    if: github.event_name == 'schedule' && github.event.schedule == '0 3 * * 1' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'challenge')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-v1/package-lock.json
      - name: 校验手动输入（白名单：纯数字 + 范围）
        env:
          CHALLENGE_SEEDS: ${{ inputs['challenge-seeds'] || '100' }}
        run: |
          case "$CHALLENGE_SEEDS" in ''|*[!0-9]*) echo "输入 challenge-seeds 非法：'$CHALLENGE_SEEDS'"; exit 1;; esac
          if [ "$CHALLENGE_SEEDS" -lt 1 ] || [ "$CHALLENGE_SEEDS" -gt 500 ]; then
            echo "challenge-seeds 超出范围 [1, 500]：$CHALLENGE_SEEDS"; exit 1
          fi
      - name: 构建 web-v1
        working-directory: web-v1
        run: npm ci --no-audit --no-fund && npm run build
      - name: 大规模冠军基线挑战（当前冠军自对弈回归基准 + V1/V2 赛马）
        env:
          CHALLENGE_SEEDS: ${{ inputs['challenge-seeds'] || '100' }}
        run: |
          (cd web-v1 && node scripts/benchmark-ai.mjs 16)
          weekly_base=$((400000000 + 10#$(date +%y) * 4000000 + 10#$(date +%j) * 1000))
          node training/simulator/cli.mjs \
            --games "$CHALLENGE_SEEDS" \
            --seed-base "$weekly_base" --out training/reports/weekly-challenge-$(date +%Y%m%d)
      - name: 上传周报
        uses: actions/upload-artifact@v4
        with:
          name: weekly-challenge-${{ github.run_id }}
          path: training/reports/weekly-challenge-*/
          retention-days: 90
