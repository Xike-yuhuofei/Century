name: CI

# Century AI 7.0 任务 B：唯一 CI 入口。
# - PR 与 main push 都从本工作流获得完整、明确的结果；
# - 共享构建只生成一次 dist，所有高成本测试并行复用；
# - 变更分类器按路径/标签选择检查集合，文档变更不再触发大规模测试；
# - ci-summary 是唯一必需检查，任何必需作业 skipped/failure/cancelled 都会失败。
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      scope:
        description: '检查范围（auto=按变更，full=全量含 macOS 研究验收）'
        type: choice
        options: [auto, full]
        default: auto
      promotion:
        description: '按正式冠军晋级机器门禁运行（无人工批准）'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.scope.outputs.build }}
      web: ${{ steps.scope.outputs.web }}
      training: ${{ steps.scope.outputs.training }}
      ai5: ${{ steps.scope.outputs.ai5 }}
      ai9: ${{ steps.scope.outputs.ai9 }}
      ui: ${{ steps.scope.outputs.ui }}
      simulation: ${{ steps.scope.outputs.simulation }}
      audit: ${{ steps.scope.outputs.audit }}
      research: ${{ steps.scope.outputs.research }}
      promotion: ${{ steps.scope.outputs.promotion }}
      pages: ${{ steps.scope.outputs.pages }}
      rules: ${{ steps.scope.outputs.rules }}
      governance: ${{ steps.scope.outputs.governance }}
      docs_only: ${{ steps.scope.outputs.docs_only }}
      audit_tier: ${{ steps.scope.outputs.audit_tier }}
      changed_count: ${{ steps.scope.outputs.changed_count }}
      reasons: ${{ steps.scope.outputs.reasons }}
      rollback: ${{ steps.scope.outputs.rollback }}
      training_shards: ${{ steps.shards.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 计算变更范围（失败关闭：diff 不可用则全量）
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          FORCE_SCOPE: ${{ inputs.scope || 'auto' }}
          FORCE_PROMOTION: ${{ inputs.promotion || 'false' }}
          CI_SCOPE_JSON: ${{ runner.temp }}/ci-scope.json
        run: node scripts/ci/change-scope.mjs
      - name: 计算 training 单测分片计划（按文件数自适应，覆盖不变）
        id: shards
        run: |
          files=$(ls training/tests/*.test.mjs | wc -l | tr -d ' ')
          # 每片至少 4 个测试文件，最多 4 片：既缩短墙钟，也不把 job 数推得过高。
          count=$(( (files + 3) / 4 ))
          if [ "$count" -gt 4 ]; then count=4; fi
          if [ "$count" -lt 1 ]; then count=1; fi
          list=$(seq -s, 0 $((count - 1)))
          echo "shards=[$list]" >> "$GITHUB_OUTPUT"
          echo "training 单测文件 $files 个 → 分片 $count 片（$list）"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-scope
          path: ${{ runner.temp }}/ci-scope.json
          if-no-files-found: warn
          retention-days: 7

  governance-tests:
    name: governance-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: CI 元测试（变更矩阵 / 汇总门禁 / 审计适配 / 产物校验 / 工作流结构）
        run: node --test --test-concurrency=2 scripts/ci/tests/*.test.mjs
      - name: 回滚门禁隔离演练（合法回滚放行 / 手工改写拒绝 / 夹带拒绝 / 回滚循环拒绝）
        run: node training/scripts/rollback-gate-drill.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rollback-gate-drill
          path: training/reports/rollback-gate-drill.json
          if-no-files-found: warn
          retention-days: 30

  rules-cards:
    name: rules-cards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 卡牌数据校验（规则与数据源）
        run: node scripts/validate-cards.mjs
      - name: 生成卡表漂移检查（data/cards.json → src/data.ts）
        run: node web-v1/scripts/sync-cards.mjs --check

  build:
    name: build
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-v1/package-lock.json
      - name: 可复现安装（npm ci）
        working-directory: web-v1
        run: npm ci --no-audit --no-fund
      - name: 编译共享产物（tsc + esbuild + ai-runtime）
        working-directory: web-v1
        run: npm run build
      - name: 校验构建产物完整性（缺文件/空文件/规划器缺失即失败）
        working-directory: web-v1
        run: node ../scripts/ci/verify-dist.mjs --dist dist
      - uses: actions/upload-artifact@v4
        with:
          name: web-v1-dist
          path: web-v1/dist
          if-no-files-found: error
          retention-days: 7
          # AI7 构建清单的 dist 部署闭包包含 .nojekyll；默认 hidden=false 会丢文件，
          # 导致下载后的 dist 与清单不一致（simulation/audit/training 均 fail-closed）。
          include-hidden-files: true

  web-unit:
    name: web-unit
    needs: [changes, build]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: web-v1-dist
          path: web-v1/dist
      - name: 卡表漂移检查
        working-directory: web-v1
        run: node scripts/sync-cards.mjs --check
      - name: web-v1 规则与 AI 单测（分片 ${{ matrix.shard }}/4，覆盖不变）
        working-directory: web-v1
        run: |
          mkdir -p test-results
          files=$(node ../scripts/ci/plan-test-shards.mjs --dir tests --shards 4 --index ${{ matrix.shard }} \
            --exclude ai.test.mjs --weights ../scripts/ci/test-runtime-weights.json)
          echo "分片文件：$files"
          node --test --test-concurrency=2 \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=test-results/junit-${{ matrix.shard }}.xml \
            $files
      - name: 离线 standalone 完整性（仅分片 0）
        if: matrix.shard == 0
        working-directory: web-v1
        run: |
          node -e "const fs=require('fs');const html=fs.readFileSync('dist/standalone.html','utf8');if(!html.includes('function choosePlan(')){console.error('standalone 缺少规划器');process.exit(1)}"
      - name: 小型 V1/V2 基准诊断（仅分片 0）
        if: matrix.shard == 0
        working-directory: web-v1
        run: node scripts/benchmark-ai.mjs 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-unit-junit-${{ matrix.shard }}
          path: web-v1/test-results/junit-${{ matrix.shard }}.xml
          if-no-files-found: ignore
          retention-days: 14

  web-long-tests:
    name: web-long-tests
    needs: [changes, build]
    if: needs.changes.outputs.web == 'true'
    # ai.test.mjs 的 4×16 局完整对局约 12 分钟，是 PR 墙钟的绝对长尾。
    # 覆盖不变：同一批对局按人数拆到 4 个并行作业，每个作业仍跑满 1..16 全部种子。
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        bots: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: web-v1-dist
          path: web-v1/dist
      - name: 完整对局长测试（人数 ${{ matrix.bots }}，种子 1–16 全量）
        working-directory: web-v1
        env:
          CENTURY_AI_TEST_BOTS: ${{ matrix.bots }}
          CENTURY_AI_TEST_SEED_START: '1'
          CENTURY_AI_TEST_SEED_END: '16'
        run: |
          mkdir -p test-results
          node --test --test-concurrency=1 \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=test-results/junit-long-${{ matrix.bots }}.xml \
            tests/ai.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-long-tests-junit-${{ matrix.bots }}
          path: web-v1/test-results/junit-long-${{ matrix.bots }}.xml
          if-no-files-found: ignore
          retention-days: 14

  training-unit:
    name: training-unit
    needs: [changes, build]
    if: needs.changes.outputs.training == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.training_shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: web-v1-dist
          path: web-v1/dist
      # training 无 npm 依赖；npm test 的 pretest 只做卡表漂移检查。禁止重复 npm install。
      - name: 卡表漂移检查
        working-directory: training
        run: node ../web-v1/scripts/sync-cards.mjs --check
      - name: training 系统测试（分片 ${{ matrix.shard }}，覆盖不变）
        working-directory: training
        env:
          SHARDS: ${{ needs.changes.outputs.training_shards }}
        run: |
          set -o pipefail
          count=$(node -e "console.log(JSON.parse(process.env.SHARDS).length)")
          files=$(node ../scripts/ci/plan-test-shards.mjs --dir tests --shards "$count" --index ${{ matrix.shard }} \
            --weights ../scripts/ci/test-runtime-weights.json)
          echo "分片文件：$files"
          node --test --test-concurrency=2 $files 2>&1 | tee "training-test-${{ matrix.shard }}.log"
      - name: AI7 进化控制面安全/可复现测试（仅分片 0）
        if: matrix.shard == 0
        working-directory: training
        run: npm run evolution:test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: training-test-log-${{ matrix.shard }}
          path: training/training-test-${{ matrix.shard }}.log
          if-no-files-found: ignore
          retention-days: 14

  simulation:
    name: simulation
    needs: [changes, build]
    if: needs.changes.outputs.simulation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: web-v1-dist
          path: web-v1/dist
      - name: PR 模拟评估（100 局覆盖不变，8 分片并行，种子连续且不重叠）
        run: node scripts/ci/run-sim-shards.mjs --games 100 --seed-base 1 --shards 8 --out training/reports/pr-eval --max-anomaly-rate 0.02
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-simulation
          path: training/reports/pr-eval
          if-no-files-found: ignore
          retention-days: 14

  ui-smoke:
    name: ui-smoke
    needs: [changes, build]
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.56.0
      - name: 安装 Playwright 与浏览器
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium webkit
      - uses: actions/download-artifact@v4
        with:
          name: web-v1-dist
          path: web-v1/dist
      - name: 浏览器 UI 冒烟（Focus / 玩家模式 / 整理 / 复盘导出）
        working-directory: web-v1
        run: |
          python scripts/live-five-smoke.py
          python scripts/smoke_focus.py
          python scripts/smoke_organize.py
          python scripts/smoke_replay.py
          python scripts/smoke_ai_runtime.py
      - name: 桌面 Focus + 内联 AI Worker（Chromium/WebKit × 3440/1920/1440）
        working-directory: web-v1
        run: python scripts/smoke_desktop_runtime.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-smoke-evidence
          path: web-v1/dist/replay-evidence
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-runtime-evidence
          path: |
            docs/ai7/desktop-runtime-metrics.json
            docs/ai7/screenshots/
          if-no-files-found: ignore
          retention-days: 14

  audit-gate:
    name: audit-gate
    needs: [changes, build]
    if: needs.changes.outputs.audit == 'true' && needs.changes.outputs.promotion != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: web-v1-dist
          path: web-v1/dist
      # 研究类变更自动提升到 research 层（dev 层包含在其中），避免同一提交重复跑两遍。
      - name: 审计门禁（${{ needs.changes.outputs.audit_tier }} 层）
        run: node training/redteam/audit-gate.mjs --tier "${{ needs.changes.outputs.audit_tier }}" --json training/reports/audit-gate.json --md training/reports/audit-gate.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-gate-report
          path: |
            training/reports/audit-gate.json
            training/reports/audit-gate.md
          if-no-files-found: ignore
          retention-days: 30

  research-node:
    name: research-node
    needs: [changes, build]
    if: needs.changes.outputs.research == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: web-v1-dist
          path: web-v1/dist
      - name: PPO 编码/合法行动/信息公平性（不含 worker 协议）
        run: node --test ai5/ppo/tests/node/encoding.test.mjs ai5/ppo/tests/node/enum-legality.test.mjs ai5/ppo/tests/node/enum-fairness.test.mjs
      - name: 种子政策与恶意样例静态拦截
        run: node --test ai5/openevolve/tests/seed-policy.test.mjs ai5/openevolve/tests/static-check.malicious.test.mjs
      - name: 研究 fitness 第一名率模式（焦点席位配对）
        run: node --test ai5/openevolve/tests/duel-first-place.test.mjs

  ai9-research:
    name: ai9-research
    needs: [changes, build]
    if: needs.changes.outputs.ai9 == 'true'
    # 编译型多模块候选依赖 macOS Seatbelt 隔离；接线审计必须在真实沙箱中执行，
    # 不能用 ubuntu 的“无沙箱编译”冒充 AI9 安全边界。
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-v1/package-lock.json
      - name: 安装 web-v1 依赖（编译型候选需要 tsc）
        working-directory: web-v1
        run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: web-v1-dist
          path: web-v1/dist
      - name: AI9 12 模块接线审计（真实引擎锁步对比，Seatbelt 编译）
        run: node training/scripts/ai9-module-wiring-audit.mjs
      - name: AI9 12 模块执行审计（真实 2–5 人对局调用计数）
        run: node training/scripts/ai9-module-execution-audit.mjs
      - name: 校验 AI9 证据完整性（12/12 接线与执行，缺一即失败）
        run: |
          node -e '
            const fs = require("fs");
            const wiring = JSON.parse(fs.readFileSync("training/reports/ai9/module-wiring-audit.json", "utf8"));
            const exec = JSON.parse(fs.readFileSync("training/reports/ai9/module-execution-audit.json", "utf8"));
            if (wiring.summary?.total !== 12) { console.error("接线审计模块数不足：", wiring.summary?.total); process.exit(1); }
            if (!(wiring.summary?.wired >= 1)) { console.error("没有任何模块产生可观测行为分歧"); process.exit(1); }
            if (exec.summary?.total !== 12 || exec.summary?.executed !== 12) {
              console.error("执行审计未覆盖 12/12：", JSON.stringify(exec.summary)); process.exit(1);
            }
            if ((exec.summary?.neverCalled ?? []).length) {
              console.error("存在注册但真实对局从未调用的模块：", exec.summary.neverCalled); process.exit(1);
            }
            console.log("AI9 证据完整性 OK：接线", wiring.summary.wired + "/12，执行", exec.summary.executed + "/12");
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai9-research-evidence
          path: |
            training/reports/ai9/module-wiring-audit.json
            training/reports/ai9/module-execution-audit.json
          if-no-files-found: ignore
          retention-days: 30

  research-worker:
    name: research-worker
    needs: [changes, build]
    if: needs.changes.outputs.research == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        case:
          - name: repro
            pattern: 全 node 席位完整对局并按种子复现
          - name: mlp
            pattern: MLP 席位往返
          - name: anomaly
            pattern: 回传越界序号被如实记为异常对局
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: web-v1-dist
          path: web-v1/dist
      # worker-protocol 单文件串行会超过 15m；拆成 3 个独立 runner 各跑 1 条用例，
      # 每条用例仍真实执行，任一失败则 research-worker 整体失败。
      - name: 对局宿主协议：${{ matrix.case.name }}
        env:
          PATTERN: ${{ matrix.case.pattern }}
        run: |
          log="$(mktemp)"
          status=0
          node --test --test-name-pattern="$PATTERN" ai5/ppo/tests/node/worker-protocol.test.mjs > "$log" 2>&1 || status=$?
          cat "$log"
          if [ "$status" -eq 0 ]; then
            # 防止测试名漂移导致 --test-name-pattern 匹配空集而静默通过。
            grep -q '^# pass 1$' "$log" || status=1
          fi
          exit "$status"

  research-e2e:
    name: research-e2e
    needs: [changes, build]
    if: needs.changes.outputs.research == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: web-v1-dist
          path: web-v1/dist
      - name: 端到端冒烟：同局双版本对战（官方自对照，4 唯一种子）
        run: |
          node ai5/openevolve/node/duel_runner.mjs --candidate-official \
            --seed-base 300000000 --seeds 4 --out /tmp/duel-smoke.json
          # 旧 ai5.yml 的零分差断言不成立：AI 预算按 performance.now 墙钟分配，
          # 两局执行顺序不同即可能产生不同决策数；这里验证管线完整性，不改 AI 行为。
          node -e "
            const r = require('/tmp/duel-smoke.json');
            if (r.config.uniqueSeedCount !== 4) process.exit(1);
            if (r.stats.totalGames !== 8) process.exit(1);
            if (r.stats.anomalyGames !== 0) process.exit(1);
            if (new Set(r.games.map(g => g.direction)).size !== 2) process.exit(1);
            for (const g of r.games) {
              if (g.status !== 'finished' || (g.ranking ?? []).length !== 5) process.exit(1);
            }
            console.log('duel smoke OK:', r.stats.totalGames, 'games,', r.config.uniqueSeedCount, 'unique seeds');
          "

  research-python:
    name: research-python
    needs: [changes, build]
    if: needs.changes.outputs.research == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-torch-cpu-py312
      - name: 安装依赖（CPU torch + numpy）
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy
      - uses: actions/download-artifact@v4
        with:
          name: web-v1-dist
          path: web-v1/dist
      - name: PPO 单元测试（GAE/PPO/奖励/softmax/种子约束）
        run: python -m unittest ai5.ppo.tests.python.test_ai5_ppo ai5.ppo.tests.python.test_seed_policy ai5.ppo.tests.python.test_export_consistency -v
      - name: 训练可靠性单元测试（对手池轮换/on-policy 边界/检查点 RNG）
        run: python -m unittest ai5.ppo.tests.python.test_training_reliability.TestSnapshotPoolRotation ai5.ppo.tests.python.test_training_reliability.TestOnPolicyBoundary ai5.ppo.tests.python.test_training_reliability.TestAuxRewardChain ai5.ppo.tests.python.test_training_reliability.TestCheckpointRngRoundTrip -v
      - name: 断点恢复确定性端到端（真实 Node worker + 引擎 + 冠军）
        run: python -m unittest ai5.ppo.tests.python.test_training_reliability.TestResumeDeterminismE2E -v

  research-seatbelt:
    name: research-seatbelt
    needs: [changes, build]
    if: needs.changes.outputs.research == 'true'
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-v1/package-lock.json
      - name: 安装 web-v1 依赖（沙箱编译需要 tsc）
        working-directory: web-v1
        run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: web-v1-dist
          path: web-v1/dist
      - name: Seatbelt 沙箱全链路验收（仅 macOS）
        run: python3 ai5/openevolve/tests/test_security_sandbox.py -v
      - name: AI9 多模块 Seatbelt 全链路测试（注册表/编译/接线/协同）
        working-directory: training
        run: |
          node --test \
            evolution/tests/module-registry.test.mjs \
            evolution/tests/multi-module-candidate.test.mjs \
            evolution/tests/coevolution.test.mjs \
            evolution/tests/module-wiring.test.mjs
      - name: AI9 模块部署/回滚隔离演练
        working-directory: training
        run: node scripts/module-deploy-drill.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai9-module-deploy-drill
          path: training/reports/ai9/module-deploy-drill.json
          if-no-files-found: ignore

  rollback-gate:
    name: rollback-gate
    needs: [changes, build]
    if: needs.changes.outputs.rollback == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: web-v1-dist
          path: web-v1/dist
      - name: 回滚独立验证（revert 目标必须是已落地晋级，恢复内容逐字节一致，无回滚循环）
        run: node scripts/ci/verify-rollback.mjs --plan training/reports/rollback-plan.json --out training/reports/rollback-verification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rollback-verification
          path: training/reports/rollback-verification.json
          if-no-files-found: ignore
          retention-days: 90

  promotion-gate:
    name: promotion-gate
    needs: [changes, build]
    if: needs.changes.outputs.promotion == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      verdict: ${{ steps.audit.outputs.verdict }}
      requires_approval: ${{ steps.audit.outputs.requires_approval }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: web-v1-dist
          path: web-v1/dist
      # REQUIRES_APPROVAL 保持红色阻断，绝不转换为成功；人工审批已移除，
      # 必须先用第一名率正式挑战满足治理条件，机器门禁才会放行。
      - name: 晋级审计（promotion 层，结构化 verdict）
        id: audit
        env:
          CI_AUDIT_RECORD: training/reports/audit-gate-promotion-record.json
        run: node scripts/ci/run-audit-gate.mjs --tier promotion --json training/reports/audit-gate-promotion.json --md training/reports/audit-gate-promotion.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: promotion-audit
          path: |
            training/reports/audit-gate-promotion.json
            training/reports/audit-gate-promotion.md
            training/reports/audit-gate-promotion-record.json
          if-no-files-found: ignore
          retention-days: 90

  promotion-machine-gate:
    name: promotion-machine-gate
    needs: [changes, build, promotion-gate, web-unit, web-long-tests, training-unit, simulation, rules-cards, governance-tests, ui-smoke, ai9-research]
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.promotion == 'true' && needs.promotion-gate.outputs.verdict == 'PASS' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: web-v1-dist
          path: web-v1/dist
      - name: 定位晋级 PR（dispatch 运行必须绑定同 head SHA 的开放 PR）
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            test -n "$PR_NUMBER" || { echo "::error::缺少 PR 编号"; exit 1; }
            echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
            echo "已验证 PR #$PR_NUMBER（pull_request 事件）"
            exit 0
          fi
          # GITHUB_TOKEN 创建的 PR 不会触发 pull_request；发布器会 dispatch 本工作流。
          # 必须绑定该分支真实开放 PR 并核对 head SHA，防止在任意分支伪造“门禁通过”。
          row=$(gh pr list --head "$REF_NAME" --base main --state open --json number,headRefOid --jq '.[0] // empty')
          test -n "$row" || { echo "::error::分支 $REF_NAME 没有开放到 main 的 PR"; exit 1; }
          number=$(printf '%s' "$row" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).number))')
          head=$(printf '%s' "$row" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).headRefOid))')
          if [ "$head" != "$HEAD_SHA" ]; then
            echo "::error::PR head $head ≠ 本次 dispatch SHA $HEAD_SHA"
            exit 1
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "已验证 dispatch 运行绑定 PR #$number（head=$head）"
      - name: 复核全部前置机器检查（任何一项非 success 即拒绝）
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node -e '
            const needs = JSON.parse(process.env.NEEDS_JSON);
            const required = ["build","web-unit","web-long-tests","training-unit","simulation","rules-cards","governance-tests","ui-smoke","ai9-research","promotion-gate"];
            for (const job of required) {
              const r = needs[job]?.result;
              if (r !== "success") { console.error(`前置机器检查未成功：${job}=${r}`); process.exit(1); }
            }
            console.log("前置机器检查全部成功");
          '
      - name: 获取 main 基线冠军（post-apply 必须有可信基线）
        run: git fetch --no-tags origin main
      - name: 第一名率证据独立复核（重算 + alpha 账本 + 种子治理 + 落地身份）
        run: |
          DIR=training/reports/first-place-promotion/latest
          test -s "$DIR/challenge-evidence.json" || { echo "::error::缺少 challenge-evidence.json"; exit 1; }
          test -s "$DIR/preregistration.json" || { echo "::error::缺少 preregistration.json"; exit 1; }
          test -s "$DIR/candidate.json" || { echo "::error::缺少 candidate.json"; exit 1; }
          # PR 中 champion.json 已是候选本身；--post-apply 验证「落地冠军 ==
          # 预注册候选」与 origin/main 基线，而不是要求当前冠军仍等于旧冠军。
          node training/scripts/promote-first-place-champion.mjs \
            --evidence "$DIR/challenge-evidence.json" \
            --plan "$DIR/preregistration.json" \
            --candidate "$DIR/candidate.json" --post-apply \
            --base-champion-ref origin/main
          # 落地冠军参数必须与 parameters.ts 生成区一致（训练/实战同一参数块）。
          node training/scripts/apply-champion.mjs --check
      - name: 自动启用 squash auto-merge（不绕过任何检查）
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HAS_AUTOMATION_TOKEN: ${{ secrets.AUTOMATION_TOKEN != '' }}
        run: |
          test -n "$PR_NUMBER" || { echo "::error::缺少 PR 编号"; exit 1; }
          gh pr merge "$PR_NUMBER" --squash --auto
          if [ "$HAS_AUTOMATION_TOKEN" != "true" ]; then
            echo "::warning::未配置 AUTOMATION_TOKEN：PR 由 GITHUB_TOKEN 创建，ruleset 的 unattributed-changes 规则可能仍要求额外批准。请配置 App/PAT（见 docs/ai9/AUTOMATION.md）。"
          fi
          echo "已启用自动合并：在所有必需检查通过后自动 squash merge，无需人工批准。"

  pages-deploy:
    name: pages-deploy
    needs: [changes, build, web-unit, ui-smoke, rules-cards]
    if: ${{ always() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.pages == 'true' && needs.build.result == 'success' && needs.web-unit.result == 'success' && needs.ui-smoke.result == 'success' && needs.rules-cards.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: web-v1-dist
          path: web-v1/dist
      - name: 准备站点（复用同一个共享构建产物，不再重跑 npm test）
        run: |
          mkdir -p _site
          cp -R web-v1/dist/. _site/
          cp web-v1/dist/standalone.html _site/index.html
          test -s _site/index.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-verify:
    name: deploy-verify
    needs: [changes, build, pages-deploy]
    if: ${{ always() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.pages == 'true' && needs.pages-deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: web-v1-dist
          path: web-v1/dist
      - name: 线上身份核验（3 次重试；只有连续失败才触发回滚，避免网络抖动误回滚）
        run: |
          EXPECTED_ARTIFACT=$(node -p "require('./web-v1/dist/build-manifest.json').artifact.sha256")
          EXPECTED_CHAMPION=$(node -p "require('./training/champions/champion.json').parameters.id")
          ok=0
          for attempt in 1 2 3; do
            echo "线上核验尝试 $attempt/3"
            if node scripts/ci/verify-deploy.mjs \
              --url "https://xike-yuhuofei.github.io/Century/" \
              --expected-artifact "$EXPECTED_ARTIFACT" \
              --expected-champion "$EXPECTED_CHAMPION" \
              --json training/reports/deploy-verification.json; then
              ok=1
              break
            fi
            sleep $((attempt * 10))
          done
          test "$ok" = "1" || { echo "::error::线上身份核验连续 3 次失败"; exit 1; }
          node -e "
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('training/reports/deploy-verification.json','utf8'));
            const identity = {
              schema: 'century-deployment-identity-v1',
              recordedAt: new Date().toISOString(),
              workflowRunId: process.env.GITHUB_RUN_ID,
              commit: process.env.GITHUB_SHA,
              artifact: process.env.EXPECTED_ARTIFACT,
              champion: process.env.EXPECTED_CHAMPION,
              url: 'https://xike-yuhuofei.github.io/Century/',
              verdict: report.verdict ?? (report.failed ? 'FAIL' : 'PASS'),
              report: 'training/reports/deploy-verification.json',
            };
            fs.writeFileSync('training/reports/deployment-identity.json', JSON.stringify(identity, null, 2));
            console.log(JSON.stringify(identity, null, 2));
          "
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deploy-verification
          path: |
            training/reports/deploy-verification.json
            training/reports/deployment-identity.json
          if-no-files-found: ignore
          retention-days: 90

  rollback-on-deploy-failure:
    name: rollback-on-deploy-failure
    needs: [deploy-verify]
    if: ${{ always() && needs.deploy-verify.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 自动回滚（revert PR + dispatch CI + auto-merge；不绕过任何检查）
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          node scripts/ci/rollback-champion.mjs \
            --reason "deploy-verify failed (run ${GITHUB_RUN_ID}: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})" \
            --json training/reports/rollback-plan.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rollback-plan
          path: training/reports/rollback-plan.json
          if-no-files-found: ignore
          retention-days: 90

  ci-summary:
    name: ci-summary
    needs:
      - changes
      - build
      - web-unit
      - web-long-tests
      - training-unit
      - simulation
      - rules-cards
      - governance-tests
      - ui-smoke
      - audit-gate
      - research-node
      - ai9-research
      - research-worker
      - research-e2e
      - research-python
      - research-seatbelt
      - rollback-gate
      - promotion-gate
      - promotion-machine-gate
      - pages-deploy
      - deploy-verify
      - rollback-on-deploy-failure
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 下载晋级审计产物（verdict 以产物为准）
        if: needs.changes.outputs.promotion == 'true'
        uses: actions/download-artifact@v4
        with:
          name: promotion-audit
          path: ${{ runner.temp }}/promotion-audit
      - name: 下载回滚验证产物（summary 必须独立复算，不能只看 job 结论）
        if: needs.changes.outputs.rollback == 'true'
        uses: actions/download-artifact@v4
        with:
          name: rollback-verification
          path: training/reports
      - name: 汇总门禁判定（独立复算变更范围 + 检查静默跳过）
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          FORCE_SCOPE: ${{ inputs.scope || 'auto' }}
          FORCE_PROMOTION: ${{ inputs.promotion || 'false' }}
          SCOPE_BUILD: ${{ needs.changes.outputs.build }}
          SCOPE_WEB: ${{ needs.changes.outputs.web }}
          SCOPE_TRAINING: ${{ needs.changes.outputs.training }}
          SCOPE_AI5: ${{ needs.changes.outputs.ai5 }}
          SCOPE_UI: ${{ needs.changes.outputs.ui }}
          SCOPE_SIMULATION: ${{ needs.changes.outputs.simulation }}
          SCOPE_AUDIT: ${{ needs.changes.outputs.audit }}
          SCOPE_RESEARCH: ${{ needs.changes.outputs.research }}
          SCOPE_AI9: ${{ needs.changes.outputs.ai9 }}
          SCOPE_PROMOTION: ${{ needs.changes.outputs.promotion }}
          SCOPE_ROLLBACK: ${{ needs.changes.outputs.rollback }}
          SCOPE_PAGES: ${{ needs.changes.outputs.pages }}
          SCOPE_RULES: ${{ needs.changes.outputs.rules }}
          SCOPE_GOVERNANCE: ${{ needs.changes.outputs.governance }}
          SCOPE_DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          SCOPE_AUDIT_TIER: ${{ needs.changes.outputs.audit_tier }}
          SCOPE_CHANGED_COUNT: ${{ needs.changes.outputs.changed_count }}
          SCOPE_REASONS: ${{ needs.changes.outputs.reasons }}
          PROMOTION_VERDICT: ${{ needs.promotion-gate.outputs.verdict }}
          PROMOTION_REQUIRES_APPROVAL: ${{ needs.promotion-gate.outputs.requires_approval }}
          PROMOTION_VERDICT_FILE: ${{ runner.temp }}/promotion-audit/audit-gate-promotion.json
          ROLLBACK_PLAN_FILE: training/reports/rollback-plan.json
          ROLLBACK_VERIFICATION_FILE: training/reports/rollback-verification.json
          CI_SUMMARY_JSON: ${{ runner.temp }}/ci-summary.json
        run: node scripts/ci/summarize.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-summary
          path: ${{ runner.temp }}/ci-summary.json
          if-no-files-found: ignore
          retention-days: 30
